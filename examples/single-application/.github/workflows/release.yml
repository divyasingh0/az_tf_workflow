name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: divyasingh0/az_tf_workflow/.github/workflows/release-please.yml@v1.0.0
    with:
      release_mode: single
      release_type: simple
      package_name: edna
      initial_version: 2.0.0
      target_branch: main
    secrets: inherit
