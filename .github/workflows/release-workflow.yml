
name: Release Trigger

# -----------------------------------------------------------------------------
# Automatically trigger release when a commit is pushed to main.
#
# VERSIONING
# ----------
# version.yml evaluates the commit that actually reached main.
#
# The Conventional Commit message is the ONLY source used for versioning.
#
# PR title, PR description and PR metadata are NOT used.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: write


# -----------------------------------------------------------------------------
# Concurrency
#
# Concurrency is controlled ONLY at the caller workflow level.
# Do not define the same concurrency group in release.yml.
# -----------------------------------------------------------------------------
concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false


jobs:

  # ============================================================================
  # Release
  # ============================================================================
  release:

    name: Release

    uses: ./.github/workflows/release.yml

    with:

      # -----------------------------------------------------------------------
      # Versioning configuration
      # -----------------------------------------------------------------------
      tag_prefix: "v"
      initial_version: "0.1.0"
      bump_override: "auto"

      # -----------------------------------------------------------------------
      # Release configuration
      # -----------------------------------------------------------------------
      dry_run: false
      draft: false
      prerelease: false

    secrets: inherit
