
name: Release Trigger

# -----------------------------------------------------------------------------
# Trigger release when a pull request is merged into main.
#
# VERSIONING
# ----------
# The commit message from the merged PR is passed to release.yml.
#
# The PR title is NOT used.
# The PR description is NOT used.
#
# Example:
#
#   git commit -m "feat(workflow): add release automation"
#
#       ↓
#
#   PR merged
#
#       ↓
#
#   version.yml
#
#       ↓
#
#   feat + workflow
#
#       ↓
#
#   workflow-v2.1.0
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches:
      - main
    types:
      - closed


permissions:
  contents: write
  pull-requests: read


# -----------------------------------------------------------------------------
# Only one release is allowed to run at a time.
# -----------------------------------------------------------------------------

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false


jobs:

  release:

    name: Release

    # Only run after the PR was actually merged.
    if: github.event.pull_request.merged == true

    uses: ./.github/workflows/release.yml

    with:

      # -----------------------------------------------------------------------
      # IMPORTANT:
      #
      # Use the commit message from the commit that GitHub created when the PR
      # was merged.
      #
      # This is the only value used for version calculation.
      # -----------------------------------------------------------------------

      commit_message: ${{ github.event.pull_request.merge_commit_message }}

      tag_prefix: "v"

      initial_version: "0.1.0"

      bump_override: "auto"

      dry_run: false

      draft: false

      prerelease: false

    secrets: inherit
