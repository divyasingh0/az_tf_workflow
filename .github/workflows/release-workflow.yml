
name: release-trigger

# -----------------------------------------------------------------------------
# Entry point for the release process.
#
# The release stream is determined automatically from the Conventional
# Commit scope.
#
# Examples:
#
#   feat(workflow): add release automation
#       -> workflow-v2.1.0
#
#   fix(release): fix release notes
#       -> release-v2.0.1
#
#   feat: update common configuration
#       -> v2.1.0
#
# If no Conventional Commit scope is present, the default "v" stream is used.
#
# Only ONE release stream is processed per workflow execution.
# -----------------------------------------------------------------------------

on:

  # ---------------------------------------------------------------------------
  # Automatic release
  # ---------------------------------------------------------------------------
  push:
    branches:
      - main

  # ---------------------------------------------------------------------------
  # Manual release
  # ---------------------------------------------------------------------------
  workflow_dispatch:
    inputs:

      bump_override:
        description: "Version bump to apply"
        required: false
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

      dry_run:
        description: "Preview release without creating a tag or publishing"
        required: false
        type: boolean
        default: false


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: write
  pull-requests: read


jobs:

  # ============================================================================
  # Release
  # ============================================================================
  release:
    name: Create Release

    uses: ./.github/workflows/release.yml

    with:
      # "v" is the default stream.
      #
      # release.yml will automatically change this to:
      #
      #   workflow-v
      #   release-v
      #   v
      #
      # based on the Conventional Commit scope.
      tag_prefix: v

      initial_version: ${{ vars.RELEASE_INITIAL_VERSION || '2.0.0' }}

      bump_override: ${{ inputs.bump_override || 'auto' }}

      dry_run: ${{ inputs.dry_run || false }}

    secrets: inherit
