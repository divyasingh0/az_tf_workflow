name: Release Trigger

# -----------------------------------------------------------------------------
# Trigger release after a pull request is merged into main.
#
# VERSIONING
# ----------
# The final commit on main is evaluated by version.yml.
#
# RELEASE NOTES
# -------------
# PR metadata comes directly from the pull_request event.
# PR title is passed ONLY to release.yml for release notes.
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches:
      - main
    types:
      - closed


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: write


# -----------------------------------------------------------------------------
# Concurrency
# -----------------------------------------------------------------------------
concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false


jobs:

  # ============================================================================
  # Release
  # ============================================================================
  release:

    name: Release

    # Only run when the PR was actually merged.
    if: github.event.pull_request.merged == true

    uses: ./.github/workflows/release.yml

    with:

      # -----------------------------------------------------------------------
      # Versioning configuration
      # -----------------------------------------------------------------------
      tag_prefix: "v"
      initial_version: "0.1.0"
      bump_override: "auto"

      # -----------------------------------------------------------------------
      # PR information
      #
      # IMPORTANT:
      # These are ONLY used for release notes.
      # They are NOT used by version.yml.
      # -----------------------------------------------------------------------
      pr_title: ${{ github.event.pull_request.title }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_author: ${{ github.event.pull_request.user.login }}

      # -----------------------------------------------------------------------
      # Release configuration
      # -----------------------------------------------------------------------
      dry_run: false
      draft: false
      prerelease: false

      # Empty means use the commit checked out by the workflow.
      target_commitish: ""

    secrets: inherit