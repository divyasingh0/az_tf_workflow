name: release-trigger

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      bump_override:
        description: "Version bump"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

      dry_run:
        description: "Preview only"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/release.yml

    with:
      initial_version: ${{ vars.RELEASE_INITIAL_VERSION || '2.0.0' }}
      bump_override: ${{ inputs.bump_override || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}

    secrets: inherit