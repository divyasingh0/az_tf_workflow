name: release-trigger
# Entry point. This is the ONLY workflow you attach to a trigger event;
# it just calls the reusable release.yml with your org's configuration.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_override:
        description: "Force a version bump"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Preview only, do not tag or publish"
        type: boolean
        default: false
      stream:
        description: "Optional release stream override for a manual run"
        type: string
        default: ""
permissions:
  contents: write
  pull-requests: read

jobs:
  select-stream:
    name: Select release stream
    runs-on: ubuntu-latest
    outputs:
      tag_prefix: ${{ steps.stream.outputs.tag_prefix }}
      scope: ${{ steps.stream.outputs.scope }}
    steps:
      - name: Select from Conventional Commit scope
        id: stream
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_STREAM: ${{ inputs.stream }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DEFAULT_STREAM: ${{ vars.RELEASE_DEFAULT_STREAM || 'default' }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$MANUAL_STREAM" ]]; then
            stream="$MANUAL_STREAM"
          else
            pr_title="$(
              gh api "repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
                --jq '.[0].title // empty' 2>/dev/null || true
            )"
            release_subject="${pr_title:-$COMMIT_MESSAGE}"

            if [[ "$release_subject" =~ ^[a-zA-Z]+\(([a-zA-Z0-9._-]+)\)(!)?: ]]; then
              stream="${BASH_REMATCH[1]}"
            elif [[ "$release_subject" =~ ^[a-zA-Z]+!\(([a-zA-Z0-9._-]+)\): ]]; then
              stream="${BASH_REMATCH[1]}"
            else
              stream="$DEFAULT_STREAM"
            fi
          fi

          if [[ ! "$stream" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Unsupported release stream: $stream"
            exit 1
          fi

          echo "tag_prefix=${stream}-v" >> "$GITHUB_OUTPUT"
          if [[ "$stream" == "$DEFAULT_STREAM" ]]; then
            # Keep the default stream distinct from an explicitly repo-wide
            # release, so unrelated scoped commits cannot enter it.
            echo "scope=__default__" >> "$GITHUB_OUTPUT"
          else
            echo "scope=${stream}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: select-stream
    uses: ./.github/workflows/release.yml
    with:
      tag_prefix: >-
        ${{ needs.select-stream.outputs.tag_prefix }}
      scope: ${{ needs.select-stream.outputs.scope }}
      default_scope: ${{ vars.RELEASE_DEFAULT_STREAM || 'default' }}
      initial_version: ${{ vars.RELEASE_INITIAL_VERSION || '2.0.0' }}
      bump_override: ${{ inputs.bump_override || 'auto' }}
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit