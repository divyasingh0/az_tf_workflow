
name: Release Trigger

# -----------------------------------------------------------------------------
# Trigger release when a commit reaches main.
#
# The commit message is the ONLY source of truth for versioning.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - main


permissions:
  contents: write


# -----------------------------------------------------------------------------
# Only one release can run at a time for main.
# -----------------------------------------------------------------------------
concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false


jobs:

  release:

    name: Release

    uses: ./.github/workflows/release.yml

    with:

      tag_prefix: "v"

      initial_version: "0.1.0"

      bump_override: "auto"

      dry_run: false

      draft: false

      prerelease: false

    secrets: inherit
