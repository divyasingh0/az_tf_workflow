name: Release Trigger

# -----------------------------------------------------------------------------
# Trigger release after a pull request is merged into main.
#
# The actual version calculation and release are handled by release.yml.
# -----------------------------------------------------------------------------

on:
  pull_request:
    branches:
      - main
    types:
      - closed


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------

permissions:
  contents: write
  pull-requests: read


# -----------------------------------------------------------------------------
# Concurrency
#
# Only one release process can run at a time for main.
# -----------------------------------------------------------------------------

concurrency:
  group: release-${{ github.repository }}-main
  cancel-in-progress: false


jobs:

  # ============================================================================
  # Release
  # ============================================================================

  release:

    name: Release

    # Only run when the PR was actually merged.
    if: github.event.pull_request.merged == true

    uses: ./.github/workflows/release.yml

    with:
      tag_prefix: "v"
      initial_version: "0.1.0"
      bump_override: "auto"
      dry_run: false
      draft: false
      prerelease: false

    secrets: inherit