name: Release

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Prefix used for this release stream, e.g. workflow-v or release-v"
        required: false
        type: string
        default: "v"

      scope:
        description: "Conventional Commit scope this component reacts to. Empty = repo-wide."
        required: false
        type: string
        default: ""

      initial_version:
        description: "Baseline version used when no previous tag exists."
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Force a version bump: auto|major|minor|patch"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Compute and log the release without creating a tag or GitHub Release."
        required: false
        type: boolean
        default: false

      draft:
        description: "Create the GitHub Release as a draft."
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Create the GitHub Release as a prerelease."
        required: false
        type: boolean
        default: false

      target_commitish:
        description: "Branch or SHA the tag should point to. Empty = triggering commit."
        required: false
        type: string
        default: ""

    outputs:
      released_version:
        description: "Released semantic version."
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released tag."
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type."
        value: ${{ jobs.version.outputs.bump_type }}

permissions:
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag_prefix }}
  cancel-in-progress: false

jobs:

  ###########################################################################
  # VERSION
  ###########################################################################

  version:
    uses: ./.github/workflows/version.yml

    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      scope: ${{ inputs.scope }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}

  ###########################################################################
  # RELEASE
  ###########################################################################

  release:
    name: Release

    needs: version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:
      released_version: ${{ steps.tag.outputs.version }}
      released_tag: ${{ steps.tag.outputs.tag }}

    steps:

      #######################################################################
      # CHECKOUT
      #######################################################################

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      #######################################################################
      # CONFIGURE GIT
      #######################################################################

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      #######################################################################
      # GET RELEASE COMMIT INFORMATION
      #######################################################################
      #
      # The commit message is used ONLY for the GitHub Release title.
      #
      # Example:
      #
      # workflow-v2.1.0 - feat(workflow): add release testing
      #
      #######################################################################

      - name: Get release commit information
        id: release_info
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_SHA="${GITHUB_SHA}"

          echo "Release commit SHA:"
          echo "${RELEASE_SHA}"

          ####################################################################
          # Get commit message
          ####################################################################

          COMMIT_MESSAGE="$(
            git log -1 \
              --pretty=format:"%s" \
              "${RELEASE_SHA}"
          )"

          if [[ -z "$COMMIT_MESSAGE" ]]; then
            echo "::error::Unable to determine release commit message."
            exit 1
          fi

          echo "Release commit message:"
          echo "${COMMIT_MESSAGE}"

          {
            echo "commit_message<<COMMIT_MESSAGE_EOF"
            echo "${COMMIT_MESSAGE}"
            echo "COMMIT_MESSAGE_EOF"
          } >> "$GITHUB_OUTPUT"

          ####################################################################
          # Find PR associated with release commit
          ####################################################################

          echo ""
          echo "Searching for PR associated with commit ${RELEASE_SHA}"

          PR_NUMBER="$(
            gh api \
              "repos/${REPO}/commits/${RELEASE_SHA}/pulls" \
              --jq '.[0].number // empty'
          )"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "::warning::No PR found for commit ${RELEASE_SHA}."

            echo "pr_number=" >> "$GITHUB_OUTPUT"

          else
            echo "PR number: ${PR_NUMBER}"

            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      #######################################################################
      # EXTRACT STANDARDIZED PR RELEASE NOTES
      #######################################################################
      #
      # IMPORTANT:
      #
      # Only the following section from the PR description is used:
      #
      # ## Release Notes
      #
      # Everything after the next ## heading is ignored.
      #
      # No changelog is generated from commits.
      # No commit list is generated.
      # No duplicate PR sections are generated.
      #
      #######################################################################

      - name: Extract standardized PR Release Notes
        id: pr_notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.release_info.outputs.pr_number }}
        run: |
          set -euo pipefail

          NOTES_FILE="/tmp/release-notes.md"

          ####################################################################
          # Get PR body
          ####################################################################

          if [[ -z "$PR_NUMBER" ]]; then

            echo "::warning::No PR found for the release commit."

            touch "$NOTES_FILE"

          else

            PR_BODY="$(
              gh api \
                "repos/${REPO}/pulls/${PR_NUMBER}" \
                --jq '.body // empty'
            )"

            if [[ -z "$PR_BODY" ]]; then

              echo "::warning::The PR body is empty."

              touch "$NOTES_FILE"

            else

              ################################################################
              # Extract ONLY the standardized Release Notes section.
              #
              # Start:
              #   ## Release Notes
              #
              # End:
              #   next ## heading
              ################################################################

              awk '
                BEGIN {
                  found=0
                }

                /^## Release Notes[[:space:]]*$/ {
                  found=1
                  print
                  next
                }

                found && /^## / {
                  exit
                }

                found {
                  print
                }
              ' <<< "$PR_BODY" > "$NOTES_FILE"

            fi

          fi

          ####################################################################
          # FALLBACK IF RELEASE NOTES SECTION IS MISSING
          ####################################################################

          if [[ ! -s "$NOTES_FILE" ]]; then

            echo "::warning::Standard '## Release Notes' section was not found."

            cat > "$NOTES_FILE" <<'EOF'
          ## Release Notes

          ### Summary

          Release notes were not provided in the pull request.

          ### Changes

          ### Affected Component

          ### Impact

          - [ ] No impact
          - [ ] Low
          - [ ] Medium
          - [ ] High

          ### Breaking Changes

          - [ ] No
          - [ ] Yes

          If yes, explain:

          ### Migration / Upgrade Notes
          EOF

          fi

          ####################################################################
          # CLEAN DUPLICATE RELEASE NOTES HEADINGS
          ####################################################################
          #
          # This protects against a PR description accidentally containing
          # more than one "## Release Notes" heading.
          #
          ####################################################################

          awk '
            BEGIN {
              count=0
            }

            /^## Release Notes[[:space:]]*$/ {
              count++

              if (count == 1) {
                print
              }

              next
            }

            {
              print
            }
          ' "$NOTES_FILE" > "${NOTES_FILE}.clean"

          mv "${NOTES_FILE}.clean" "$NOTES_FILE"

          ####################################################################
          # OUTPUT RELEASE NOTES
          ####################################################################

          {
            echo "release_notes<<RELEASE_NOTES_EOF"
            cat "$NOTES_FILE"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

          ####################################################################
          # LOG
          ####################################################################

          echo ""
          echo "============================================================"
          echo "STANDARDIZED RELEASE NOTES"
          echo "============================================================"

          cat "$NOTES_FILE"

          echo "============================================================"

      #######################################################################
      # CREATE ANNOTATED TAG
      #######################################################################

      - name: Create annotated tag
        id: tag
        shell: bash
        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

          ####################################################################
          # DRY RUN
          ####################################################################

          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run enabled."
            echo "::notice::Would create tag: ${NEXT_TAG}"
            echo "::notice::Version: ${NEXT_VERSION}"
            echo "::notice::Bump type: ${BUMP_TYPE}"

            exit 0

          fi

          ####################################################################
          # CREATE AND PUSH TAG
          ####################################################################

          git tag \
            -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"

          git push origin "$NEXT_TAG"

      #######################################################################
      # CREATE GITHUB RELEASE
      #######################################################################
      #
      # Release title:
      #
      #   <tag> - <merged commit message>
      #
      # Release body:
      #
      #   ONLY standardized PR Release Notes
      #
      #######################################################################

      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT_MESSAGE: ${{ steps.release_info.outputs.commit_message }}
          RELEASE_NOTES: ${{ steps.pr_notes.outputs.release_notes }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail

          NOTES_FILE="/tmp/final-release-notes.md"

          ####################################################################
          # RELEASE BODY
          #
          # Nothing else is added here.
          ####################################################################

          printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"

          ####################################################################
          # RELEASE TITLE
          ####################################################################

          RELEASE_TITLE="${TAG} - ${COMMIT_MESSAGE}"

          echo "Release title:"
          echo "${RELEASE_TITLE}"

          ####################################################################
          # RELEASE ARGUMENTS
          ####################################################################

          ARGS=(
            --title "$RELEASE_TITLE"
            --notes-file "$NOTES_FILE"
          )

          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ -n "$TARGET" ]]; then
            ARGS+=(--target "$TARGET")
          fi

          ####################################################################
          # CREATE RELEASE
          ####################################################################

          gh release create "$TAG" "${ARGS[@]}"

      #######################################################################
      # SUMMARY
      #######################################################################

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release Summary"
            echo ""
            echo "- Tag prefix: \`${{ inputs.tag_prefix }}\`"
            echo "- Scope: \`${{ inputs.scope || 'repo-wide' }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Released version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Released tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Release commit: \`${{ github.sha }}\`"
            echo "- Release PR: \`${{ steps.release_info.outputs.pr_number || 'not found' }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
