name: Release

# Reusable workflow: calculates the next version, creates an annotated
# Git tag, and publishes a GitHub Release with PR-based release notes.

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Prefix for the release tag"
        required: false
        type: string
        default: "v"

      scope:
        description: "Conventional commit scope, e.g. compute. Empty = repo-wide."
        required: false
        type: string
        default: ""

      initial_version:
        description: "Initial version when no previous tag exists"
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Force version bump"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Preview only. Do not create tag or release."
        required: false
        type: boolean
        default: false

      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Create the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false

      target_commitish:
        description: "Branch/SHA the release should target"
        required: false
        type: string
        default: ""

    outputs:
      released_version:
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        value: ${{ jobs.version.outputs.bump_type }}

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag_prefix }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------
  # Calculate next version
  # ---------------------------------------------------------
  version:
    uses: ./.github/workflows/version.yml
    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      scope: ${{ inputs.scope }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}

  # ---------------------------------------------------------
  # Create tag and GitHub Release
  # ---------------------------------------------------------
  release:
    name: Release
    needs: version
    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:
      released_version: ${{ steps.tag.outputs.version }}
      released_tag: ${{ steps.tag.outputs.tag }}

    steps:

      # -----------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # -----------------------------------------------------
      # Configure Git
      # -----------------------------------------------------
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------
      # Create annotated tag
      # -----------------------------------------------------
      - name: Create annotated tag
        id: tag
        shell: bash
        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Dry run - would create tag $NEXT_TAG (bump: $BUMP_TYPE). No tag pushed."
            exit 0
          fi

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"

      # -----------------------------------------------------
      # Generate GitHub release notes
      #
      # GitHub generates these from merged PRs rather than
      # listing every individual commit.
      # -----------------------------------------------------
      - name: Generate release notes
        if: inputs.dry_run == false
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          TARGET: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail

          ARGS=(
            --method POST
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes"
            -f "tag_name=$TAG"
          )

          if [[ -n "$TARGET" ]]; then
            ARGS+=(-f "target_commitish=$TARGET")
          fi

          gh api "${ARGS[@]}" > "$RUNNER_TEMP/release-notes.json"

          jq -r '.body' "$RUNNER_TEMP/release-notes.json" \
            > "$RUNNER_TEMP/release-notes.md"

          {
            echo "changelog<<RELEASE_NOTES_EOF"
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------
      # Create GitHub Release
      # -----------------------------------------------------
      - name: Create GitHub Release
        if: inputs.dry_run == false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.changelog }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          ARGS=(
            --title "$TAG"
            --notes "$NOTES"
          )

          [[ "$DRAFT" == "true" ]] && ARGS+=(--draft)
          [[ "$PRERELEASE" == "true" ]] && ARGS+=(--prerelease)

          gh release create "$TAG" "${ARGS[@]}"

      # -----------------------------------------------------
      # Summary
      # -----------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "### Release Summary"
            echo "- Scope: \`${{ inputs.scope || 'repo-wide' }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Released tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"