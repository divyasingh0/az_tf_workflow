
name: Release

# -----------------------------------------------------------------------------
# Reusable release workflow.
#
# The release stream is determined from the Conventional Commit scope.
#
# Examples:
#
#   feat(workflow): add feature
#       -> workflow-v2.1.0
#
#   fix(release): fix issue
#       -> release-v2.0.1
#
#   feat: common change
#       -> v2.1.0
#
# Only the stream matching the triggering commit is updated.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      # -----------------------------------------------------------------------
      # Default tag prefix
      # -----------------------------------------------------------------------
      tag_prefix:
        description: "Default tag prefix when commit has no scope"
        required: false
        type: string
        default: "v"

      initial_version:
        description: "Initial version when no previous tag exists"
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Force version bump: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Preview only. Do not create tag or release."
        required: false
        type: boolean
        default: false

      draft:
        description: "Create GitHub Release as draft"
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Create GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

      target_commitish:
        description: "Branch or SHA the release should target"
        required: false
        type: string
        default: ""

    # -------------------------------------------------------------------------
    # Outputs
    # -------------------------------------------------------------------------
    outputs:

      released_version:
        description: "Released semantic version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released Git tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: write
  pull-requests: read


# -----------------------------------------------------------------------------
# Concurrency
#
# The stream is not known until version calculation, therefore concurrency is
# kept at workflow level. cancel-in-progress is false so releases never race.
# -----------------------------------------------------------------------------
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ============================================================================
  # Calculate version
  # ============================================================================
  version:
    name: Calculate Version

    uses: ./.github/workflows/version.yml

    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}

    secrets: inherit


  # ============================================================================
  # Create tag and GitHub Release
  # ============================================================================
  release:
    name: Create ${{ needs.version.outputs.release_tag_prefix }} Release

    needs: version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:
      released_version: ${{ steps.tag.outputs.version }}
      released_tag: ${{ steps.tag.outputs.tag }}

    steps:

      # -------------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0


      # -------------------------------------------------------------------------
      # Configure Git
      # -------------------------------------------------------------------------
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # -------------------------------------------------------------------------
      # Find triggering PR
      # -------------------------------------------------------------------------
      - name: Find triggering pull request
        if: inputs.dry_run == false
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PR=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '
              .[]
              | select(.merged_at != null)
              | {
                  number,
                  title,
                  author: .user.login,
                  url: .html_url
                }
            ' \
            | jq -s '.[0] // empty')

          if [[ -z "$PR" ]]; then
            echo "::error::No merged pull request found for commit ${SHA}."
            exit 1
          fi

          PR_NUMBER=$(echo "$PR" | jq -r '.number')
          PR_TITLE=$(echo "$PR" | jq -r '.title')
          PR_AUTHOR=$(echo "$PR" | jq -r '.author')
          PR_URL=$(echo "$PR" | jq -r '.url')

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title=$PR_TITLE" >> "$GITHUB_OUTPUT"
          echo "author=$PR_AUTHOR" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          echo "::notice::Release triggered by PR #${PR_NUMBER}: ${PR_TITLE}"


      # -------------------------------------------------------------------------
      # Create annotated tag
      # -------------------------------------------------------------------------
      - name: Create annotated tag
        id: tag
        shell: bash
        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PREFIX: ${{ needs.version.outputs.release_tag_prefix }}
          RELEASE_SCOPE: ${{ needs.version.outputs.release_scope }}
        run: |
          set -euo pipefail

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          echo "::group::Release Information"
          echo "Scope       : ${RELEASE_SCOPE:-repo-wide}"
          echo "Tag prefix  : ${RELEASE_PREFIX}"
          echo "Bump type   : ${BUMP_TYPE}"
          echo "Version     : ${NEXT_VERSION}"
          echo "Tag         : ${NEXT_TAG}"
          echo "::endgroup::"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Dry run - tag $NEXT_TAG would be created."
            exit 0
          fi

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"


      # -------------------------------------------------------------------------
      # Generate release notes
      # -------------------------------------------------------------------------
      - name: Generate release notes
        if: inputs.dry_run == false
        id: changelog
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SCOPE: ${{ needs.version.outputs.release_scope }}
        run: |
          set -euo pipefail

          {
            echo "## Changes"
            echo
            echo "- ${PR_TITLE} ([#${PR_NUMBER}](${PR_URL})) by @${PR_AUTHOR}"
            echo
            echo "### Release Information"
            echo
            echo "- Scope: \`${SCOPE:-repo-wide}\`"
            echo "- Tag: \`${TAG}\`"
          } > "$RUNNER_TEMP/release-notes.md"

          echo "file=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------------------------
      # Create GitHub Release
      # -------------------------------------------------------------------------
      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET: ${{ inputs.target_commitish }}
        run: |
          set -euo pipefail

          ARGS=(
            "$TAG"
            --title "$TAG"
            --notes-file "$NOTES_FILE"
          )

          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ -n "$TARGET" ]]; then
            ARGS+=(--target "$TARGET" )
          fi

          gh release create "${ARGS[@]}"


      # -------------------------------------------------------------------------
      # Summary
      # -------------------------------------------------------------------------
      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo
            echo "- Scope: \`${{ needs.version.outputs.release_scope || 'repo-wide' }}\`"
            echo "- Tag prefix: \`${{ needs.version.outputs.release_tag_prefix }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Released tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Triggering PR: #${{ steps.pr.outputs.number || 'N/A' }}"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

