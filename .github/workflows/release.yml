name: Release

# ============================================================
# CENTRALIZED REUSABLE RELEASE WORKFLOW
#
# Responsibilities:
#
# 1. Call release-version.yml
# 2. Calculate next semantic version
# 3. Find merged PRs since previous release
# 4. Read PR title + PR description
# 5. Build standardized release notes
# 6. Create annotated Git tag
# 7. Create GitHub Release
#
# IMPORTANT:
# Version calculation is NOT based on PR description.
# Version calculation remains based on Conventional Commits.
#
# Release-note content IS based on PR information.
# ============================================================

on:
  workflow_call:

    inputs:

      # --------------------------------------------------------
      # Example:
      # network-v2.3.0
      # --------------------------------------------------------
      tag_prefix:
        type: string
        default: "v"

      # --------------------------------------------------------
      # Optional component scope.
      #
      # Example:
      # scope: network
      #
      # Then only PRs such as:
      #
      # feat(network): add private endpoint
      #
      # are considered for this release.
      # --------------------------------------------------------
      scope:
        description: "Conventional commit scope for this component"
        required: false
        type: string
        default: ""

      # --------------------------------------------------------
      # Initial version if no previous tag exists.
      # --------------------------------------------------------
      initial_version:
        type: string
        default: "0.1.0"

      # --------------------------------------------------------
      # auto / patch / minor / major
      # --------------------------------------------------------
      bump_override:
        type: string
        default: "auto"

      # --------------------------------------------------------
      # Dry run:
      # calculate everything but don't create tag/release.
      # --------------------------------------------------------
      dry_run:
        type: boolean
        default: false

      # --------------------------------------------------------
      # Create GitHub Release as draft.
      # --------------------------------------------------------
      draft:
        type: boolean
        default: false

      # --------------------------------------------------------
      # Mark GitHub Release as prerelease.
      # --------------------------------------------------------
      prerelease:
        type: boolean
        default: false

      # --------------------------------------------------------
      # Optional target commit.
      # --------------------------------------------------------
      target_commitish:
        type: string
        default: ""

    outputs:

      released_version:
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        value: ${{ jobs.version.outputs.bump_type }}


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write
  pull-requests: read


# ============================================================
# PREVENT TWO RELEASES FROM RUNNING AT THE SAME TIME
# ============================================================

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag_prefix }}
  cancel-in-progress: false


# ============================================================
# JOB 1
#
# Calculate semantic version.
#
# This continues using your existing release-version.yml.
# ============================================================

jobs:

  version:

    uses: ./.github/workflows/version.yml

    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      scope: ${{ inputs.scope }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}


  # ==========================================================
  # JOB 2
  #
  # Generate release notes from PRs.
  #
  # IMPORTANT:
  # We DO NOT use:
  #
  # git log
  #
  # for the release notes.
  #
  # Instead:
  #
  # Previous tag
  #      ↓
  # GitHub merged PRs
  #      ↓
  # PR title
  # PR description
  #      ↓
  # Standard release notes
  # ==========================================================

  release:

    name: Release

    needs: version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}


    steps:

      # --------------------------------------------------------
      # Checkout complete history.
      #
      # Needed to:
      # - access existing tags
      # - identify previous release
      # - validate PR merge commits
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0


      # --------------------------------------------------------
      # Configure git identity.
      # --------------------------------------------------------

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ========================================================
      # GENERATE RELEASE NOTES FROM PRs
      # ========================================================

      - name: Generate release notes from merged PRs
        id: changelog

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}

          REPO: ${{ github.repository }}

          TAG_PREFIX: ${{ inputs.tag_prefix }}

          SCOPE: ${{ inputs.scope }}

          # Current commit from which the release is created
          TARGET_SHA: ${{ github.sha }}

        run: |

          set -euo pipefail


          # ----------------------------------------------------
          # Find the previous release tag.
          #
          # Example:
          #
          # network-v2.2.0
          #
          # If no previous tag exists, we use the beginning
          # of repository history.
          # ----------------------------------------------------

          LAST_TAG=$(git tag \
            --list "${TAG_PREFIX}*" \
            --sort=-v:refname \
            | head -n1 || true)


          echo "Previous release tag: ${LAST_TAG:-<none>}"


          # ----------------------------------------------------
          # Get all merged PRs from GitHub.
          #
          # We deliberately use PRs instead of git commits.
          #
          # This gives us:
          #
          # - PR number
          # - PR title
          # - PR body
          # - labels
          # - merge commit
          # - author
          # - URL
          #
          # We retrieve up to 100 merged PRs.
          # Increase the limit if your repository needs more.
          # ----------------------------------------------------

          PR_DATA=$(gh pr list \
            --repo "$REPO" \
            --state merged \
            --base main \
            --limit 100 \
            --json number,title,body,labels,mergeCommit,author,url,mergedAt)


          # ----------------------------------------------------
          # Create temporary files for categorized release notes.
          # ----------------------------------------------------

          FEATURES_FILE=$(mktemp)
          FIXES_FILE=$(mktemp)
          BREAKING_FILE=$(mktemp)
          OTHER_FILE=$(mktemp)

          touch "$FEATURES_FILE"
          touch "$FIXES_FILE"
          touch "$BREAKING_FILE"
          touch "$OTHER_FILE"


          # ----------------------------------------------------
          # Process each PR.
          #
          # jq converts the JSON array into one PR object
          # per line.
          # ----------------------------------------------------

          echo "$PR_DATA" | jq -c '.[]' | while read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')

            PR_TITLE=$(echo "$PR" | jq -r '.title')

            PR_BODY=$(echo "$PR" | jq -r '.body // ""')

            PR_URL=$(echo "$PR" | jq -r '.url')

            MERGE_SHA=$(echo "$PR" | jq -r '.mergeCommit.oid // ""')


            # --------------------------------------------------
            # Skip PRs where GitHub does not have a merge SHA.
            # --------------------------------------------------

            if [[ -z "$MERGE_SHA" ]]; then
              continue
            fi


            # --------------------------------------------------
            # Verify that the PR belongs to the current release
            # range.
            #
            # If there is a previous tag:
            #
            # LAST_TAG..HEAD
            #
            # Otherwise:
            #
            # repository history..HEAD
            # --------------------------------------------------

            if [[ -n "$LAST_TAG" ]]; then

              if ! git merge-base --is-ancestor "$LAST_TAG" "$MERGE_SHA" 2>/dev/null; then
                continue
              fi

              if ! git merge-base --is-ancestor "$MERGE_SHA" "$TARGET_SHA" 2>/dev/null; then
                continue
              fi

            else

              if ! git merge-base --is-ancestor "$MERGE_SHA" "$TARGET_SHA" 2>/dev/null; then
                continue
              fi

            fi


            # --------------------------------------------------
            # Optional component scope filtering.
            #
            # Example:
            #
            # scope = network
            #
            # Accepted:
            #
            # feat(network): add private endpoint
            #
            # fix(network): correct subnet validation
            #
            # --------------------------------------------------

            if [[ -n "$SCOPE" ]]; then

              if ! echo "$PR_TITLE" | grep -qE \
                "^[a-zA-Z]+\\(${SCOPE}\\)!?:|^${SCOPE}:";
              then
                continue
              fi

            fi


            # --------------------------------------------------
            # Allow developers to explicitly exclude a PR from
            # release notes.
            #
            # Add this label:
            #
            # release-note: none
            #
            # --------------------------------------------------

            HAS_EXCLUDE_LABEL=$(echo "$PR" | jq -r '
              [.labels[].name]
              | map(select(. == "release-note: none"))
              | length
            ')


            if [[ "$HAS_EXCLUDE_LABEL" != "0" ]]; then
              continue
            fi


            # --------------------------------------------------
            # Determine release category.
            #
            # We use the PR title / Conventional Commit type.
            #
            # feat! / BREAKING CHANGE → Breaking Changes
            # feat                    → Features
            # fix                     → Bug Fixes
            # everything else         → Other Changes
            # --------------------------------------------------

            if echo "$PR_TITLE" | grep -qE \
              "^[a-zA-Z]+(\\([^)]*\\))?!:"; then

              CATEGORY="breaking"

            elif echo "$PR_BODY" | grep -qiE \
              "^## Breaking Changes|BREAKING CHANGE"; then

              CATEGORY="breaking"

            elif echo "$PR_TITLE" | grep -qE \
              "^feat(\\([^)]*\\))?!?:"; then

              CATEGORY="feature"

            elif echo "$PR_TITLE" | grep -qE \
              "^fix(\\([^)]*\\))?!?:"; then

              CATEGORY="fix"

            else

              CATEGORY="other"

            fi


            # --------------------------------------------------
            # Extract ONLY the useful sections from PR body.
            #
            # This prevents the entire PR description from
            # being dumped into the release notes.
            #
            # Expected PR template:
            #
            # ## Summary
            #
            # ## Changes
            #
            # ## Breaking Changes
            #
            # ## Upgrade Notes
            #
            # ## Jira
            # --------------------------------------------------

            SUMMARY=$(echo "$PR_BODY" | awk '
              /^## Summary/ {flag=1; next}
              /^## / {flag=0}
              flag
            ')


            CHANGES=$(echo "$PR_BODY" | awk '
              /^## Changes/ {flag=1; next}
              /^## / {flag=0}
              flag
            ')


            BREAKING_CHANGES=$(echo "$PR_BODY" | awk '
              /^## Breaking Changes/ {flag=1; next}
              /^## / {flag=0}
              flag
            ')


            UPGRADE_NOTES=$(echo "$PR_BODY" | awk '
              /^## Upgrade Notes/ {flag=1; next}
              /^## / {flag=0}
              flag
            ')


            JIRA=$(echo "$PR_BODY" | awk '
              /^## Jira/ {flag=1; next}
              /^## / {flag=0}
              flag
            ')


            # --------------------------------------------------
            # Remove leading/trailing blank lines.
            # --------------------------------------------------

            SUMMARY=$(echo "$SUMMARY" | sed '/^[[:space:]]*$/d')

            CHANGES=$(echo "$CHANGES" | sed '/^[[:space:]]*$/d')

            BREAKING_CHANGES=$(echo "$BREAKING_CHANGES" | sed '/^[[:space:]]*$/d')

            UPGRADE_NOTES=$(echo "$UPGRADE_NOTES" | sed '/^[[:space:]]*$/d')

            JIRA=$(echo "$JIRA" | sed '/^[[:space:]]*$/d')


            # --------------------------------------------------
            # Build the release-note entry.
            #
            # The PR title becomes the heading.
            #
            # The PR description provides the meaningful detail.
            # --------------------------------------------------

            ENTRY="### ${PR_TITLE} (#${PR_NUMBER})"$'\n'

            if [[ -n "$SUMMARY" ]]; then
              ENTRY+=$'\n'"$SUMMARY"$'\n'
            fi

            if [[ -n "$CHANGES" ]]; then
              ENTRY+=$'\n'"**Changes**"$'\n\n'"$CHANGES"$'\n'
            fi

            if [[ -n "$BREAKING_CHANGES" ]]; then
              ENTRY+=$'\n'"**Breaking Changes**"$'\n\n'"$BREAKING_CHANGES"$'\n'
            fi

            if [[ -n "$UPGRADE_NOTES" ]]; then
              ENTRY+=$'\n'"**Upgrade Notes**"$'\n\n'"$UPGRADE_NOTES"$'\n'
            fi

            if [[ -n "$JIRA" ]]; then
              ENTRY+=$'\n'"**Jira / Change**"$'\n\n'"$JIRA"$'\n'
            fi

            ENTRY+=$'\n'"[View PR #${PR_NUMBER}](${PR_URL})"$'\n'


            # --------------------------------------------------
            # Store the entry in the appropriate category.
            # --------------------------------------------------

            case "$CATEGORY" in

              breaking)
                printf '%s\n\n' "$ENTRY" >> "$BREAKING_FILE"
                ;;

              feature)
                printf '%s\n\n' "$ENTRY" >> "$FEATURES_FILE"
                ;;

              fix)
                printf '%s\n\n' "$ENTRY" >> "$FIXES_FILE"
                ;;

              *)
                printf '%s\n\n' "$ENTRY" >> "$OTHER_FILE"
                ;;

            esac

          done


          # ====================================================
          # BUILD FINAL RELEASE NOTES
          # ====================================================

          NOTES_FILE=$(mktemp)


          echo "## Release Summary" >> "$NOTES_FILE"

          echo "" >> "$NOTES_FILE"

          echo "Release: **${{ needs.version.outputs.next_tag }}**" >> "$NOTES_FILE"

          echo "" >> "$NOTES_FILE"

          echo "This release contains the approved changes merged since the previous release." >> "$NOTES_FILE"

          echo "" >> "$NOTES_FILE"


          # ----------------------------------------------------
          # Breaking Changes
          # ----------------------------------------------------

          if [[ -s "$BREAKING_FILE" ]]; then

            echo "## ⚠️ Breaking Changes" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$BREAKING_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Features
          # ----------------------------------------------------

          if [[ -s "$FEATURES_FILE" ]]; then

            echo "## 🚀 Features" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$FEATURES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Bug fixes
          # ----------------------------------------------------

          if [[ -s "$FIXES_FILE" ]]; then

            echo "## 🐛 Bug Fixes" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$FIXES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Other changes
          # ----------------------------------------------------

          if [[ -s "$OTHER_FILE" ]]; then

            echo "## 🔄 Other Changes" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$OTHER_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Save release notes to GitHub Actions output.
          #
          # Multiline output is required because release notes
          # contain markdown.
          # ----------------------------------------------------

          {
            echo "changelog<<RELEASE_NOTES_EOF"

            cat "$NOTES_FILE"

            echo "RELEASE_NOTES_EOF"

          } >> "$GITHUB_OUTPUT"


          # ----------------------------------------------------
          # Also print release notes in workflow logs.
          # ----------------------------------------------------

          echo "=========================================="

          echo "Generated Release Notes"

          echo "=========================================="

          cat "$NOTES_FILE"


      # ========================================================
      # CREATE ANNOTATED GIT TAG
      # ========================================================

      - name: Create annotated tag

        id: tag

        shell: bash

        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}

          NEXT_VERSION: ${{ needs.version.outputs.next_version }}

          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}

          DRY_RUN: ${{ inputs.dry_run }}

        run: |

          set -euo pipefail


          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"


          # ----------------------------------------------------
          # Dry run means:
          #
          # - calculate version
          # - generate release notes
          # - DO NOT create tag
          # - DO NOT create GitHub Release
          # ----------------------------------------------------

          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run — would create tag $NEXT_TAG"

            echo "::notice::Bump type: $BUMP_TYPE"

            exit 0

          fi


          # ----------------------------------------------------
          # Create annotated tag.
          # ----------------------------------------------------

          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"


          # ----------------------------------------------------
          # Push tag to GitHub.
          # ----------------------------------------------------

          git push origin "$NEXT_TAG"


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release

        if: inputs.dry_run == false

        env:

          GH_TOKEN: ${{ github.token }}

          TAG: ${{ steps.tag.outputs.tag }}

          NOTES: ${{ steps.changelog.outputs.changelog }}

          DRAFT: ${{ inputs.draft }}

          PRERELEASE: ${{ inputs.prerelease }}

          TARGET: ${{ inputs.target_commitish }}

        run: |

          set -euo pipefail


          # ----------------------------------------------------
          # Build GitHub CLI arguments.
          # ----------------------------------------------------

          ARGS=(
            --title "$TAG"
            --notes "$NOTES"
          )


          # ----------------------------------------------------
          # Optional draft release.
          # ----------------------------------------------------

          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi


          # ----------------------------------------------------
          # Optional prerelease.
          # ----------------------------------------------------

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi


          # ----------------------------------------------------
          # Optional target commit.
          # ----------------------------------------------------

          if [[ -n "$TARGET" ]]; then
            ARGS+=(--target "$TARGET")
          fi


          # ----------------------------------------------------
          # Create GitHub Release using our custom PR-based
          # release notes.
          #
          # IMPORTANT:
          #
          # We are NOT using:
          #
          # --generate-notes
          #
          # because GitHub would generate its own commit/PR
          # based notes.
          # ----------------------------------------------------

          gh release create "$TAG" "${ARGS[@]}"


      # ========================================================
      # WORKFLOW SUMMARY
      # ========================================================

      - name: Summary

        if: always()

        run: |

          {
            echo "### Release Summary"

            echo ""

            echo "- Scope: \`${{ inputs.scope || 'repo-wide' }}\`"

            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"

            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"

            echo "- Released version: \`${{ needs.version.outputs.next_version }}\`"

            echo "- Released tag: \`${{ steps.tag.outputs.tag }}\`"

            echo "- Dry run: \`${{ inputs.dry_run }}\`"

          } >> "$GITHUB_STEP_SUMMARY"