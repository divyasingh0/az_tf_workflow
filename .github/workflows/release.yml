name: Release

# -----------------------------------------------------------------------------
# Reusable release workflow.
#
# VERSIONING
# ----------
# version.yml is the single source of truth for version calculation.
#
# RELEASE
# -------
# This workflow creates the Git tag and GitHub Release based on the version
# calculated by version.yml.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      # -----------------------------------------------------------------------
      # Default tag prefix
      # -----------------------------------------------------------------------
      tag_prefix:
        description: "Default tag prefix when commit has no scope"
        required: false
        type: string
        default: "v"

      # -----------------------------------------------------------------------
      # Initial version
      # -----------------------------------------------------------------------
      initial_version:
        description: "Initial version when no previous tag exists"
        required: false
        type: string
        default: "0.1.0"

      # -----------------------------------------------------------------------
      # Version bump override
      # -----------------------------------------------------------------------
      bump_override:
        description: "Force version bump: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"

      # -----------------------------------------------------------------------
      # Dry run
      # -----------------------------------------------------------------------
      dry_run:
        description: "Preview only. Do not create tag or release."
        required: false
        type: boolean
        default: false

      # -----------------------------------------------------------------------
      # Draft
      # -----------------------------------------------------------------------
      draft:
        description: "Create GitHub Release as draft"
        required: false
        type: boolean
        default: false

      # -----------------------------------------------------------------------
      # Prerelease
      # -----------------------------------------------------------------------
      prerelease:
        description: "Create GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

      # -----------------------------------------------------------------------
      # Target commit
      # -----------------------------------------------------------------------
      target_commitish:
        description: "Branch or SHA the release should target"
        required: false
        type: string
        default: ""

    outputs:

      released_version:
        description: "Released semantic version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released Git tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: write


# -----------------------------------------------------------------------------
# Concurrency
# -----------------------------------------------------------------------------
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ============================================================================
  # Calculate version
  # ============================================================================
  version:
    name: Calculate Version

    uses: ./.github/workflows/version.yml

    with:
      tag_prefix: ${{ inputs.tag_prefix }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}

    secrets: inherit


  # ============================================================================
  # Create tag and GitHub Release
  # ============================================================================
  release:
    name: Create ${{ needs.version.outputs.release_tag_prefix }} Release

    needs: version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:
      released_version: ${{ steps.tag.outputs.version }}
      released_tag: ${{ steps.tag.outputs.tag }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}


      # -----------------------------------------------------------------------
      # Configure Git
      # -----------------------------------------------------------------------
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # -----------------------------------------------------------------------
      # Create annotated tag
      # -----------------------------------------------------------------------
      - name: Create annotated tag
        id: tag
        shell: bash
        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_PREFIX: ${{ needs.version.outputs.release_tag_prefix }}
          RELEASE_SCOPE: ${{ needs.version.outputs.release_scope }}

        run: |
          set -euo pipefail

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          echo "::group::Release Information"
          echo "Scope       : ${RELEASE_SCOPE:-repo-wide}"
          echo "Tag prefix  : ${RELEASE_PREFIX}"
          echo "Bump type   : ${BUMP_TYPE}"
          echo "Version     : ${NEXT_VERSION}"
          echo "Tag         : ${NEXT_TAG}"
          echo "::endgroup::"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Dry run - tag $NEXT_TAG would be created."
            exit 0
          fi

          # Prevent accidental duplicate tag creation.
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: $NEXT_TAG"
            exit 1
          fi

          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"


      # -----------------------------------------------------------------------
      # Create GitHub Release
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
          TARGET: ${{ inputs.target_commitish }}

        run: |
          set -euo pipefail

          ARGS=(
            "$TAG"
            --title "$TAG"
            --generate-notes
          )

          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ -n "$TARGET" ]]; then
            ARGS+=(--target "$TARGET")
          fi

          gh release create "${ARGS[@]}"


      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo
            echo "- Scope: \`${{ needs.version.outputs.release_scope || 'repo-wide' }}\`"
            echo "- Tag prefix: \`${{ needs.version.outputs.release_tag_prefix }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Released tag: \`${{ steps.tag.outputs.tag }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"