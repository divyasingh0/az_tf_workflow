name: Release

# ============================================================
# CENTRALIZED REUSABLE RELEASE WORKFLOW
#
# Purpose:
#   - Determine which component/release stream should be released
#   - Always target the V2 release stream
#   - Calculate the next SemVer version
#   - Generate PR-based release notes
#   - Create the annotated Git tag
#   - Create the GitHub Release
#
# Example:
#
#   feat(storage): add private endpoint
#
#       ↓
#
#   storage
#       ↓
#
#   storage-v2
#       ↓
#
#   storage-v2.0.0
#       ↓
#
#   storage-v2.1.0
#
# Historical tags such as:
#
#   storage-v1.5.0
#
# are NEVER considered.
# ============================================================

on:
  workflow_call:

    inputs:

      # --------------------------------------------------------
      # Initial version for a release stream.
      #
      # Your newly created streams already start at 2.0.0.
      # Therefore this is mainly a bootstrap value.
      # --------------------------------------------------------

      initial_version:
        description: "Initial version for a new release stream"
        required: false
        type: string
        default: "2.0.0"

      # --------------------------------------------------------
      # Allows manual override of the calculated SemVer bump.
      # --------------------------------------------------------

      bump_override:
        description: "auto|patch|minor|major"
        required: false
        type: string
        default: "auto"

      # --------------------------------------------------------
      # Dry run.
      # --------------------------------------------------------

      dry_run:
        description: "Calculate release without creating tag/release"
        required: false
        type: boolean
        default: false

      # --------------------------------------------------------
      # Optional GitHub Release settings.
      # --------------------------------------------------------

      draft:
        required: false
        type: boolean
        default: false

      prerelease:
        required: false
        type: boolean
        default: false

      target_commitish:
        required: false
        type: string
        default: ""

    outputs:

      released_version:
        description: "Released version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write
  pull-requests: read


# ============================================================
# PREVENT TWO RELEASES RUNNING AT THE SAME TIME
# ============================================================

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1
  #
  # Determine the component from the Conventional Commit.
  #
  # Example:
  #
  # feat(storage): add endpoint
  #
  # Component = storage
  #
  # Then construct:
  #
  # storage-v
  #
  # IMPORTANT:
  #
  # We explicitly use V2.
  #
  # storage-v1.x.x is historical and ignored.
  # ==========================================================

  determine-stream:

    name: Determine Release Stream

    runs-on: ubuntu-latest

    outputs:

      component:
        value: ${{ steps.stream.outputs.component }}

      tag_prefix:
        value: ${{ steps.stream.outputs.tag_prefix }}

    steps:

      # --------------------------------------------------------
      # Get complete repository history and all tags.
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # DETERMINE RELEASE STREAM
      # ========================================================

      - name: Determine release stream

        id: stream

        shell: bash

        run: |

          set -euo pipefail

          echo "=========================================="

          echo "Determine Release Stream"

          echo "=========================================="


          # ----------------------------------------------------
          # Read the latest commit message.
          #
          # Example:
          #
          # feat(storage): add private endpoint
          # ----------------------------------------------------

          COMMIT_SUBJECT=$(git log -1 --pretty=format:"%s")

          echo "Commit: $COMMIT_SUBJECT"


          # ----------------------------------------------------
          # Extract Conventional Commit scope.
          #
          # feat(storage): ...
          #      ^^^^^^^
          #
          # Result:
          #
          # storage
          # ----------------------------------------------------

          COMPONENT=""

          if [[ "$COMMIT_SUBJECT" =~ ^[a-zA-Z]+\\(([^)]+)\\)(!)?: ]]; then

            COMPONENT="${BASH_REMATCH[1]}"

          fi


          # ----------------------------------------------------
          # Scope is mandatory for your multi-tag repository.
          #
          # We do NOT guess the component.
          # ----------------------------------------------------

          if [[ -z "$COMPONENT" ]]; then

            echo "::error::No release component found in commit message."

            echo ""

            echo "For a multi-tag repository, use a Conventional Commit such as:"

            echo ""

            echo "  feat(storage): add private endpoint"

            echo "  fix(network): correct subnet configuration"

            echo "  feat(workflow): improve release workflow"

            exit 1

          fi


          echo "Component: $COMPONENT"


          # ----------------------------------------------------
          # IMPORTANT:
          #
          # The release stream is ALWAYS V2.
          #
          # Example:
          #
          # storage → storage-v2
          # network → network-v2
          # workflow → workflow-v2
          #
          # This prevents old V1 tags from being selected.
          # ----------------------------------------------------

          TAG_PREFIX="${COMPONENT}-v2."


          echo "Release stream: ${COMPONENT}-v2"

          echo "Tag pattern: ${TAG_PREFIX}x.x"


          # ----------------------------------------------------
          # Verify that at least one V2 tag exists.
          #
          # Example:
          #
          # storage-v2.0.0
          # ----------------------------------------------------

          MATCHING_TAG=$(
            git tag --list "${COMPONENT}-v2.*" |
            head -n1 || true
          )


          if [[ -z "$MATCHING_TAG" ]]; then

            echo "::error::No V2 release tag found for component '$COMPONENT'."

            echo ""

            echo "Expected baseline tag:"

            echo "  ${COMPONENT}-v2.0.0"

            echo ""

            echo "Existing tags for this component:"

            git tag --list "${COMPONENT}-v*"

            exit 1

          fi


          echo "Found V2 baseline: $MATCHING_TAG"


          # ----------------------------------------------------
          # Export values.
          #
          # tag_prefix will be:
          #
          # storage-v
          #
          # network-v
          #
          # workflow-v
          #
          # This is what release-version.yml will use.
          # ----------------------------------------------------

          RELEASE_PREFIX="${COMPONENT}-v"

          {

            echo "component=$COMPONENT"

            echo "tag_prefix=$RELEASE_PREFIX"

          } >> "$GITHUB_OUTPUT"


  # ==========================================================
  # JOB 2
  #
  # Calculate SemVer for ONLY the selected V2 stream.
  #
  # Example:
  #
  # storage-v2.0.0
  #
  #        ↓
  #
  # storage-v2.1.0
  #
  # NOTE:
  #
  # This section intentionally passes the complete V2 scope
  # information to release-version.yml.
  # ==========================================================

  version:

    name: Calculate Version

    needs: determine-stream

    uses: ./.github/workflows/release-version.yml

    with:

      tag_prefix: ${{ needs.determine-stream.outputs.tag_prefix }}

      scope: ${{ needs.determine-stream.outputs.component }}

      initial_version: ${{ inputs.initial_version }}

      bump_override: ${{ inputs.bump_override }}


  # ==========================================================
  # JOB 3
  #
  # Generate release notes + create tag + GitHub Release.
  # ==========================================================

  release:

    name: Create Release

    needs:
      - determine-stream
      - version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}


    steps:

      # --------------------------------------------------------
      # Full history is required for release/tag comparison.
      # --------------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # GENERATE RELEASE NOTES
      # ========================================================

      - name: Generate release notes

        id: changelog

        shell: bash

        env:

          GH_TOKEN: ${{ github.token }}

          REPOSITORY: ${{ github.repository }}

          COMPONENT: ${{ needs.determine-stream.outputs.component }}

          TAG_PREFIX: ${{ needs.determine-stream.outputs.tag_prefix }}

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "Generate Release Notes"

          echo "=========================================="


          echo "Component : $COMPONENT"

          echo "Tag prefix: $TAG_PREFIX"


          # ----------------------------------------------------
          # Find latest V2 tag ONLY.
          #
          # IMPORTANT:
          #
          # storage-v1.5.0
          #
          # will NOT match the required V2 stream.
          #
          # We explicitly filter to:
          #
          # storage-v2.*
          # ----------------------------------------------------

          LAST_TAG=$(
            git tag \
              --list "${COMPONENT}-v2.*" \
              --sort=-v:refname |
            head -n1 || true
          )


          echo "Previous V2 tag: ${LAST_TAG:-none}"


          # ----------------------------------------------------
          # Find merged PRs.
          # ----------------------------------------------------

          PR_DATA=$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state merged \
              --base main \
              --limit 100 \
              --json number,title,body,mergeCommit,url
          )


          FEATURES_FILE=$(mktemp)

          FIXES_FILE=$(mktemp)

          BREAKING_FILE=$(mktemp)


          touch "$FEATURES_FILE"

          touch "$FIXES_FILE"

          touch "$BREAKING_FILE"


          # ====================================================
          # PROCESS PRs
          # ====================================================

          echo "$PR_DATA" | jq -c '.[]' | while read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')

            PR_TITLE=$(echo "$PR" | jq -r '.title')

            PR_BODY=$(echo "$PR" | jq -r '.body // ""')

            PR_URL=$(echo "$PR" | jq -r '.url')

            MERGE_SHA=$(echo "$PR" | jq -r '.mergeCommit.oid // ""')


            # --------------------------------------------------
            # Ignore PRs without merge commit.
            # --------------------------------------------------

            if [[ -z "$MERGE_SHA" ]]; then

              continue

            fi


            # --------------------------------------------------
            # PR must belong to the selected component.
            #
            # Example:
            #
            # Selected:
            # storage
            #
            # Include:
            # feat(storage): ...
            #
            # Exclude:
            # feat(network): ...
            # --------------------------------------------------

            if ! echo "$PR_TITLE" | grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!?:"
            then

              continue

            fi


            # --------------------------------------------------
            # PR must be after the latest V2 release.
            #
            # This is the important part that prevents old V1
            # history from appearing in the release notes.
            # --------------------------------------------------

            if [[ -n "$LAST_TAG" ]]; then

              if ! git merge-base \
                --is-ancestor "$LAST_TAG" "$MERGE_SHA" \
                2>/dev/null
              then

                continue

              fi

            fi


            # ==================================================
            # Extract Summary from PR description.
            #
            # Recommended PR format:
            #
            # ## Summary
            #
            # Added private endpoint configuration.
            #
            # ## Testing
            #
            # Terraform plan validated successfully.
            #
            # Only Summary is used in release notes.
            # ==================================================

            SUMMARY=$(
              echo "$PR_BODY" |
              awk '
                /^## Summary/ {
                  flag=1
                  next
                }

                /^## / {
                  flag=0
                }

                flag
              '
            )


            SUMMARY=$(
              echo "$SUMMARY" |
              sed '/^[[:space:]]*$/d'
            )


            # ==================================================
            # Build release-note entry.
            # ==================================================

            ENTRY="### ${PR_TITLE} (#${PR_NUMBER})"$'\n\n'


            if [[ -n "$SUMMARY" ]]; then

              ENTRY+="$SUMMARY"$'\n\n'

            fi


            ENTRY+="[View PR #${PR_NUMBER}](${PR_URL})"$'\n'


            # ==================================================
            # Categorize PR.
            # ==================================================

            if echo "$PR_TITLE" |
              grep -qE \
              "^[a-zA-Z]+\\([^)]*\\)!:"
            then

              printf '%s\n\n' "$ENTRY" \
                >> "$BREAKING_FILE"


            elif echo "$PR_TITLE" |
              grep -qE \
              "^feat\\([^)]*\\):"
            then

              printf '%s\n\n' "$ENTRY" \
                >> "$FEATURES_FILE"


            elif echo "$PR_TITLE" |
              grep -qE \
              "^fix\\([^)]*\\):"
            then

              printf '%s\n\n' "$ENTRY" \
                >> "$FIXES_FILE"

            fi

          done


          # ====================================================
          # BUILD FINAL RELEASE NOTES
          # ====================================================

          NOTES_FILE=$(mktemp)


          echo "# ${COMPONENT} V2 Release" >> "$NOTES_FILE"

          echo "" >> "$NOTES_FILE"


          # ----------------------------------------------------
          # Breaking changes
          # ----------------------------------------------------

          if [[ -s "$BREAKING_FILE" ]]; then

            echo "## ⚠️ Breaking Changes" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$BREAKING_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Features
          # ----------------------------------------------------

          if [[ -s "$FEATURES_FILE" ]]; then

            echo "## 🚀 Features" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$FEATURES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Bug fixes
          # ----------------------------------------------------

          if [[ -s "$FIXES_FILE" ]]; then

            echo "## 🐛 Bug Fixes" >> "$NOTES_FILE"

            echo "" >> "$NOTES_FILE"

            cat "$FIXES_FILE" >> "$NOTES_FILE"

          fi


          # ====================================================
          # Export release notes.
          # ====================================================

          {

            echo "changelog<<RELEASE_NOTES_EOF"

            cat "$NOTES_FILE"

            echo "RELEASE_NOTES_EOF"

          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # CREATE ANNOTATED TAG
      # ========================================================

      - name: Create annotated tag

        id: tag

        shell: bash

        env:

          NEXT_TAG: ${{ needs.version.outputs.next_tag }}

          NEXT_VERSION: ${{ needs.version.outputs.next_version }}

          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}

          DRY_RUN: ${{ inputs.dry_run }}

        run: |

          set -euo pipefail


          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"


          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run."

            echo "::notice::Would create tag: $NEXT_TAG"

            echo "::notice::Bump type: $BUMP_TYPE"

            exit 0

          fi


          # ----------------------------------------------------
          # Create annotated tag.
          # ----------------------------------------------------

          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"


          # ----------------------------------------------------
          # Push tag.
          # ----------------------------------------------------

          git push origin "$NEXT_TAG"


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release

        if: inputs.dry_run == false

        env:

          GH_TOKEN: ${{ github.token }}

          TAG: ${{ steps.tag.outputs.tag }}

          NOTES: ${{ steps.changelog.outputs.changelog }}

          DRAFT: ${{ inputs.draft }}

          PRERELEASE: ${{ inputs.prerelease }}

          TARGET: ${{ inputs.target_commitish }}

        run: |

          set -euo pipefail


          ARGS=(
            --title "$TAG"
            --notes "$NOTES"
          )


          if [[ "$DRAFT" == "true" ]]; then

            ARGS+=(--draft)

          fi


          if [[ "$PRERELEASE" == "true" ]]; then

            ARGS+=(--prerelease)

          fi


          if [[ -n "$TARGET" ]]; then

            ARGS+=(--target "$TARGET")

          fi


          # ----------------------------------------------------
          # IMPORTANT:
          #
          # Do NOT use --generate-notes.
          #
          # We already generated standardized PR-based notes.
          # ----------------------------------------------------

          gh release create "$TAG" "${ARGS[@]}"


      # ========================================================
      # GITHUB ACTION SUMMARY
      # ========================================================

      - name: Release summary

        if: always()

        run: |

          {

            echo "## Release Summary"

            echo ""

            echo "- Component: \`${{ needs.determine-stream.outputs.component }}\`"

            echo "- Release stream: \`${{ needs.determine-stream.outputs.component }}-v2\`"

            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"

            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"

            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"

            echo "- Released tag: \`${{ needs.version.outputs.next_tag }}\`"

            echo "- Dry run: \`${{ inputs.dry_run }}\`"

          } >> "$GITHUB_STEP_SUMMARY"