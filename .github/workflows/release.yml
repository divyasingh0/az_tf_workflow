name: Release

# ============================================================
# CENTRALIZED REUSABLE RELEASE WORKFLOW
#
# Flow:
#
#   release-trigger.yml
#          ↓
#       release.yml
#          ↓
#   release-version.yml
#
# Release stream is determined from the merged PR title.
#
# Example:
#
#   feat(storage): add private endpoint
#
#        ↓
#
#   storage-v2
#
#        ↓
#
#   storage-v2.1.0
#
# Release notes are generated from the PR's:
#
#   ## Summary
#
# ============================================================

on:
  workflow_call:

    inputs:

      initial_version:
        description: "Initial version for a new release stream"
        required: false
        type: string
        default: "2.0.0"

      bump_override:
        description: "auto|patch|minor|major"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Calculate release without creating tag/release"
        required: false
        type: boolean
        default: false

      draft:
        description: "Create GitHub Release as draft"
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Create GitHub Release as prerelease"
        required: false
        type: boolean
        default: false

      target_commitish:
        description: "Optional branch or SHA for GitHub Release"
        required: false
        type: string
        default: ""

    outputs:

      released_version:
        description: "Released version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


permissions:
  contents: write
  pull-requests: read


# Prevent two releases for the same repository/ref from racing.
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1
  #
  # Find the merged PR associated with the current push.
  #
  # IMPORTANT:
  #
  # We do NOT use:
  #
  #   git log -1
  #
  # because the latest commit after a PR merge can be:
  #
  #   Merge pull request #35 ...
  #
  # Instead, GitHub PR metadata is used.
  # ==========================================================

  determine-stream:

    name: Determine Release Stream

    runs-on: ubuntu-latest

    outputs:

      component: ${{ steps.stream.outputs.component }}

      release_stream: ${{ steps.stream.outputs.release_stream }}

      pr_number: ${{ steps.stream.outputs.pr_number }}

    steps:

      - name: Find merged PR

        id: find-pr

        env:
          GH_TOKEN: ${{ github.token }}

        shell: bash

        run: |

          set -euo pipefail

          echo "Finding merged PR for commit: $GITHUB_SHA"

          PR_NUMBER=""

          # ----------------------------------------------------
          # Find the PR associated with the commit that triggered
          # this workflow.
          # ----------------------------------------------------

          PR_NUMBER=$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | .number' |
            head -n1 || true
          )

          # ----------------------------------------------------
          # Fallback for squash/merge situations:
          # search recently merged PRs and match merge commit.
          # ----------------------------------------------------

          if [[ -z "$PR_NUMBER" ]]; then

            PR_NUMBER=$(
              gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --state merged \
                --base main \
                --limit 50 \
                --json number,mergeCommit |
              jq -r \
                --arg SHA "$GITHUB_SHA" \
                '.[] | select(.mergeCommit.oid == $SHA) | .number' |
              head -n1 || true
            )

          fi

          if [[ -z "$PR_NUMBER" ]]; then

            echo "::error::Unable to determine merged PR for commit $GITHUB_SHA"

            exit 1

          fi

          echo "Merged PR: #$PR_NUMBER"

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"


      # ========================================================
      # Determine component from PR title.
      #
      # Example:
      #
      # feat(storage): add private endpoint
      #
      # component = storage
      #
      # release_stream = storage-v2
      # ========================================================

      - name: Determine release stream

        id: stream

        env:

          GH_TOKEN: ${{ github.token }}

          PR_NUMBER: ${{ steps.find-pr.outputs.pr_number }}

        shell: bash

        run: |

          set -euo pipefail

          PR_TITLE=$(
            gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json title \
              --jq '.title'
          )

          echo "PR: #$PR_NUMBER"
          echo "PR title: $PR_TITLE"

          # ----------------------------------------------------
          # Extract Conventional Commit scope.
          #
          # Supported:
          #
          # feat(storage): ...
          # fix(storage): ...
          # feat(storage)!: ...
          # ----------------------------------------------------

          if [[ "$PR_TITLE" =~ ^[a-zA-Z]+\(([^)]+)\)!?: ]]; then

            COMPONENT="${BASH_REMATCH[1]}"

          else

            echo "::error::PR title does not contain a valid Conventional Commit scope."

            echo ""
            echo "Expected examples:"
            echo "  feat(storage): add private endpoint"
            echo "  fix(network): correct subnet"
            echo "  feat(workflow)!: change release process"

            exit 1

          fi

          RELEASE_STREAM="${COMPONENT}-v2"

          echo "Component: $COMPONENT"
          echo "Release stream: $RELEASE_STREAM"

          {
            echo "component=$COMPONENT"
            echo "release_stream=$RELEASE_STREAM"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"


  # ==========================================================
  # JOB 2
  #
  # Calculate version for ONLY the selected release stream.
  #
  # Example:
  #
  # storage-v2.0.0
  #       ↓
  # storage-v2.1.0
  # ==========================================================

  version:

    name: Calculate Version

    needs: determine-stream

    uses: ./.github/workflows/version.yml

    with:

      release_stream: ${{ needs.determine-stream.outputs.release_stream }}

      scope: ${{ needs.determine-stream.outputs.component }}

      initial_version: ${{ inputs.initial_version }}

      bump_override: ${{ inputs.bump_override }}


  # ==========================================================
  # JOB 3
  #
  # Generate release notes from merged PRs.
  #
  # Only PRs belonging to the selected component and after the
  # latest V2 release are included.
  #
  # PR:
  #
  #   ## Summary
  #
  # becomes the release-note content.
  # ==========================================================

  release:

    name: Create Release

    needs:
      - determine-stream
      - version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # GENERATE RELEASE NOTES
      # ========================================================

      - name: Generate release notes

        id: changelog

        env:

          GH_TOKEN: ${{ github.token }}

          COMPONENT: ${{ needs.determine-stream.outputs.component }}

          RELEASE_STREAM: ${{ needs.determine-stream.outputs.release_stream }}

        shell: bash

        run: |

          set -euo pipefail

          echo "Generating release notes..."

          echo "Component: $COMPONENT"
          echo "Release stream: $RELEASE_STREAM"


          # ----------------------------------------------------
          # Find latest tag for THIS release stream only.
          #
          # Example:
          #
          # storage-v2.1.0
          #
          # V1 tags are ignored.
          # ----------------------------------------------------

          LAST_TAG=$(
            git tag --list "${RELEASE_STREAM}.*" \
              --sort=-v:refname |
            head -n1 || true
          )

          echo "Previous release: ${LAST_TAG:-none}"


          # ----------------------------------------------------
          # Determine commit range.
          # ----------------------------------------------------

          RANGE="HEAD"

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          fi


          # ----------------------------------------------------
          # Get commits in the selected release stream.
          # ----------------------------------------------------

          MERGE_SHAS=$(
            git log "$RANGE" \
              --merges \
              --format="%H"
          )


          FEATURES_FILE=$(mktemp)
          FIXES_FILE=$(mktemp)
          BREAKING_FILE=$(mktemp)

          touch "$FEATURES_FILE"
          touch "$FIXES_FILE"
          touch "$BREAKING_FILE"


          # ====================================================
          # PROCESS MERGED PRS
          # ====================================================

          for SHA in $MERGE_SHAS; do

            PR_NUMBER=$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
                --jq '.[0].number // empty' 2>/dev/null || true
            )

            [[ -z "$PR_NUMBER" ]] && continue


            PR_TITLE=$(
              gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json title \
                --jq '.title'
            )


            # --------------------------------------------------
            # Only include PRs for the selected component.
            # --------------------------------------------------

            if ! echo "$PR_TITLE" |
              grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!?:"
            then
              continue
            fi


            # --------------------------------------------------
            # Extract PR body.
            # --------------------------------------------------

            PR_BODY=$(
              gh pr view "$PR_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --json body \
                --jq '.body // ""'
            )


            # --------------------------------------------------
            # Extract ## Summary only.
            # --------------------------------------------------

            SUMMARY=$(
              echo "$PR_BODY" |
              awk '
                /^## Summary[[:space:]]*$/ {
                  found=1
                  next
                }

                /^## / {
                  found=0
                }

                found {
                  print
                }
              '
            )


            SUMMARY=$(
              echo "$SUMMARY" |
              sed '/^[[:space:]]*$/d'
            )


            # --------------------------------------------------
            # Build release-note entry.
            # --------------------------------------------------

            ENTRY="### ${PR_TITLE} (#${PR_NUMBER})"$'\n\n'

            if [[ -n "$SUMMARY" ]]; then
              ENTRY+="${SUMMARY}"$'\n\n'
            fi

            ENTRY+="[View PR #${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})"


            # --------------------------------------------------
            # Categorize PR.
            # --------------------------------------------------

            if echo "$PR_TITLE" |
              grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!:"
            then

              printf '%s\n\n' "$ENTRY" >> "$BREAKING_FILE"

            elif echo "$PR_TITLE" |
              grep -qE \
              "^feat\\(${COMPONENT}\\):"
            then

              printf '%s\n\n' "$ENTRY" >> "$FEATURES_FILE"

            elif echo "$PR_TITLE" |
              grep -qE \
              "^fix\\(${COMPONENT}\\):"
            then

              printf '%s\n\n' "$ENTRY" >> "$FIXES_FILE"

            fi

          done


          # ====================================================
          # BUILD FINAL RELEASE NOTES
          # ====================================================

          NOTES_FILE=$(mktemp)

          echo "# ${COMPONENT} V2 Release" >> "$NOTES_FILE"

          echo "" >> "$NOTES_FILE"


          if [[ -s "$BREAKING_FILE" ]]; then

            echo "## ⚠️ Breaking Changes" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$BREAKING_FILE" >> "$NOTES_FILE"

          fi


          if [[ -s "$FEATURES_FILE" ]]; then

            echo "## 🚀 Features" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$FEATURES_FILE" >> "$NOTES_FILE"

          fi


          if [[ -s "$FIXES_FILE" ]]; then

            echo "## 🐛 Bug Fixes" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$FIXES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Export release notes.
          # ----------------------------------------------------

          {
            echo "changelog<<RELEASE_NOTES_EOF"
            cat "$NOTES_FILE"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # CREATE ANNOTATED TAG
      # ========================================================

      - name: Create annotated tag

        id: tag

        env:

          NEXT_TAG: ${{ needs.version.outputs.next_tag }}

          NEXT_VERSION: ${{ needs.version.outputs.next_version }}

          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}

          DRY_RUN: ${{ inputs.dry_run }}

        shell: bash

        run: |

          set -euo pipefail

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"


          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run enabled."
            echo "::notice::Would create tag: $NEXT_TAG"
            echo "::notice::Bump type: $BUMP_TYPE"

            exit 0

          fi


          # ----------------------------------------------------
          # Create annotated tag.
          # ----------------------------------------------------

          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"


          git push origin "$NEXT_TAG"


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release

        if: inputs.dry_run == false

        env:

          GH_TOKEN: ${{ github.token }}

          TAG: ${{ steps.tag.outputs.tag }}

          NOTES: ${{ steps.changelog.outputs.changelog }}

          DRAFT: ${{ inputs.draft }}

          PRERELEASE: ${{ inputs.prerelease }}

          TARGET: ${{ inputs.target_commitish }}

        shell: bash

        run: |

          set -euo pipefail


          ARGS=(
            --title "$TAG"
            --notes "$NOTES"
          )


          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi


          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi


          if [[ -n "$TARGET" ]]; then
            ARGS+=(--target "$TARGET")
          fi


          # ----------------------------------------------------
          # IMPORTANT:
          #
          # Do NOT use --generate-notes.
          #
          # Release notes are generated from PR ## Summary.
          # ----------------------------------------------------

          gh release create "$TAG" "${ARGS[@]}"


      # ========================================================
      # WORKFLOW SUMMARY
      # ========================================================

      - name: Release summary

        if: always()

        run: |

          {
            echo "## Release Summary"
            echo ""
            echo "- Component: \`${{ needs.determine-stream.outputs.component }}\`"
            echo "- Release stream: \`${{ needs.determine-stream.outputs.release_stream }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Released tag: \`${{ needs.version.outputs.next_tag }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"