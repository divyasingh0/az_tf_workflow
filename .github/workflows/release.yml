name: Release

on:
  workflow_call:
    inputs:

      initial_version:
        description: "Initial version for a release stream"
        required: false
        type: string
        default: "2.0.0"

      bump_override:
        description: "auto|patch|minor|major"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Calculate release without creating tag/release"
        required: false
        type: boolean
        default: false

      draft:
        required: false
        type: boolean
        default: false

      prerelease:
        required: false
        type: boolean
        default: false

      target_commitish:
        required: false
        type: string
        default: ""

    outputs:

      released_version:
        description: "Released version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


permissions:
  contents: write
  pull-requests: read


concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ==========================================================
  # 1. DETERMINE COMPONENT
  #
  # feat(storage): xxx
  #        ↓
  #     storage
  #
  # feat(network): xxx
  #        ↓
  #     network
  # ==========================================================

  determine-stream:

    name: Determine Release Stream

    runs-on: ubuntu-latest

    outputs:

      component:
        value: ${{ steps.stream.outputs.component }}

      tag_prefix:
        value: ${{ steps.stream.outputs.tag_prefix }}

    steps:

      - name: Checkout repository

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      - name: Determine component

        id: stream

        shell: bash

        run: |

          set -euo pipefail

          COMMIT_SUBJECT=$(git log -1 --pretty=format:"%s")

          echo "Latest commit:"
          echo "$COMMIT_SUBJECT"


          # --------------------------------------------------
          # Extract Conventional Commit scope.
          #
          # feat(storage): xxx
          #       ^^^^^^^
          #
          # Result:
          # storage
          # --------------------------------------------------

          COMPONENT=""

          if [[ "$COMMIT_SUBJECT" =~ ^[a-zA-Z]+\\(([^)]+)\\)(!)?: ]]; then
            COMPONENT="${BASH_REMATCH[1]}"
          fi


          # --------------------------------------------------
          # Scope is mandatory for multi-tag repository.
          # --------------------------------------------------

          if [[ -z "$COMPONENT" ]]; then

            echo "::error::No component scope found."

            echo ""
            echo "Expected format:"
            echo "  feat(storage): description"
            echo "  fix(network): description"
            echo "  feat(workflow): description"

            exit 1

          fi


          echo "Component: $COMPONENT"


          # --------------------------------------------------
          # Tag prefix.
          #
          # storage -> storage-v
          # network -> network-v
          # workflow -> workflow-v
          #
          # V2 filtering happens in version.yml.
          # --------------------------------------------------

          TAG_PREFIX="${COMPONENT}-v"


          # --------------------------------------------------
          # Verify that the V2 stream exists.
          #
          # This prevents old V1 streams from being selected.
          # --------------------------------------------------

          V2_TAG=$(git tag --list "${COMPONENT}-v2.*" \
            --sort=-v:refname | head -n1 || true)


          if [[ -z "$V2_TAG" ]]; then

            echo "::error::No V2 release stream found for '$COMPONENT'."

            echo ""
            echo "Expected baseline tag:"
            echo "  ${COMPONENT}-v2.0.0"

            echo ""
            echo "Existing tags:"
            git tag --list "${COMPONENT}-v*"

            exit 1

          fi


          echo "V2 baseline: $V2_TAG"


          {
            echo "component=$COMPONENT"
            echo "tag_prefix=$TAG_PREFIX"
          } >> "$GITHUB_OUTPUT"


  # ==========================================================
  # 2. CALCULATE VERSION
  #
  # This calls release-version.yml.
  #
  # Example:
  #
  # component = storage
  # tag_prefix = storage-v
  #
  # version.yml will select ONLY:
  #
  # storage-v2.*
  # ==========================================================

  version:

    name: Calculate Version

    needs: determine-stream

    uses: ./.github/workflows/release-version.yml

    with:

      tag_prefix: ${{ needs.determine-stream.outputs.tag_prefix }}

      scope: ${{ needs.determine-stream.outputs.component }}

      initial_version: ${{ inputs.initial_version }}

      bump_override: ${{ inputs.bump_override }}


  # ==========================================================
  # 3. CREATE RELEASE
  # ==========================================================

  release:

    name: Create Release

    needs:
      - determine-stream
      - version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}


    steps:

      - name: Checkout repository

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # GENERATE RELEASE NOTES
      # ========================================================

      - name: Generate release notes

        id: changelog

        shell: bash

        env:

          GH_TOKEN: ${{ github.token }}

          REPOSITORY: ${{ github.repository }}

          COMPONENT: ${{ needs.determine-stream.outputs.component }}

        run: |

          set -euo pipefail


          echo "Component: $COMPONENT"


          # ----------------------------------------------------
          # ONLY V2 TAGS ARE CONSIDERED.
          #
          # storage-v1.5.0 -> ignored
          # storage-v1.9.0 -> ignored
          # storage-v2.0.0 -> selected
          # ----------------------------------------------------

          LAST_TAG=$(
            git tag --list "${COMPONENT}-v2.*" \
              --sort=-v:refname |
            head -n1 || true
          )


          echo "Previous V2 tag: ${LAST_TAG:-none}"


          # ----------------------------------------------------
          # Determine commit range.
          # ----------------------------------------------------

          RANGE="HEAD"

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          fi


          echo "Release range: $RANGE"


          # ----------------------------------------------------
          # Get commits belonging ONLY to this component.
          # ----------------------------------------------------

          COMMITS=$(git log "$RANGE" \
            --pretty=format:"%s%n%b%n---" \
            --no-merges)


          FEATURES=""

          FIXES=""

          BREAKING=""


          while IFS= read -r LINE; do

            [[ -z "$LINE" ]] && continue

            # Ignore separator
            [[ "$LINE" == "---" ]] && continue


            # --------------------------------------------------
            # Only process commits for selected component.
            # --------------------------------------------------

            if ! echo "$LINE" | grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!?:"
            then
              continue
            fi


            if echo "$LINE" | grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!:"
            then

              BREAKING+="* ${LINE}"$'\n'


            elif echo "$LINE" | grep -qE \
              "^feat\\(${COMPONENT}\\):"
            then

              FEATURES+="* ${LINE}"$'\n'


            elif echo "$LINE" | grep -qE \
              "^fix\\(${COMPONENT}\\):"
            then

              FIXES+="* ${LINE}"$'\n'

            fi

          done <<< "$COMMITS"


          # ====================================================
          # BUILD RELEASE NOTES
          # ====================================================

          NOTES="## ${COMPONENT} V2 Release"$'\n\n'


          if [[ -n "$BREAKING" ]]; then

            NOTES+="### Breaking Changes"$'\n\n'

            NOTES+="$BREAKING"$'\n'

          fi


          if [[ -n "$FEATURES" ]]; then

            NOTES+="### Features"$'\n\n'

            NOTES+="$FEATURES"$'\n'

          fi


          if [[ -n "$FIXES" ]]; then

            NOTES+="### Bug Fixes"$'\n\n'

            NOTES+="$FIXES"$'\n'

          fi


          # ----------------------------------------------------
          # Export release notes.
          # ----------------------------------------------------

          {
            echo "changelog<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # CREATE ANNOTATED TAG
      # ========================================================

      - name: Create annotated tag

        id: tag

        shell: bash

        env:

          NEXT_TAG: ${{ needs.version.outputs.next_tag }}

          NEXT_VERSION: ${{ needs.version.outputs.next_version }}

          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}

          DRY_RUN: ${{ inputs.dry_run }}

        run: |

          set -euo pipefail


          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"


          echo "Next tag: $NEXT_TAG"

          echo "Next version: $NEXT_VERSION"

          echo "Bump type: $BUMP_TYPE"


          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run - tag will NOT be created."

            exit 0

          fi


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"


          git push origin "$NEXT_TAG"


      # ========================================================
      # CREATE GITHUB RELEASE
      # ========================================================

      - name: Create GitHub Release

        if: inputs.dry_run == false

        env:

          GH_TOKEN: ${{ github.token }}

          TAG: ${{ steps.tag.outputs.tag }}

          NOTES: ${{ steps.changelog.outputs.changelog }}

        run: |

          set -euo pipefail


          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES"


      # ========================================================
      # SUMMARY
      # ========================================================

      - name: Release summary

        if: always()

        run: |

          {

            echo "## Release Summary"

            echo ""

            echo "- Component: \`${{ needs.determine-stream.outputs.component }}\`"

            echo "- Release stream: \`${{ needs.determine-stream.outputs.component }}-v2\`"

            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"

            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"

            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"

            echo "- Released tag: \`${{ needs.version.outputs.next_tag }}\`"

            echo "- Dry run: \`${{ inputs.dry_run }}\`"

          } >> "$GITHUB_STEP_SUMMARY"