name: Release

on:
  workflow_call:
    inputs:

      initial_version:
        required: false
        type: string
        default: "2.0.0"

      bump_override:
        required: false
        type: string
        default: "auto"

      dry_run:
        required: false
        type: boolean
        default: false

      draft:
        required: false
        type: boolean
        default: false

      prerelease:
        required: false
        type: boolean
        default: false

    outputs:

      released_version:
        description: "Released version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.version.outputs.bump_type }}


permissions:
  contents: write
  pull-requests: read


concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ==========================================================
  # JOB 1
  # Determine component from the commit message.
  #
  # feat(storage): add private endpoint
  #              ↓
  #           storage
  #              ↓
  #           storage-v2
  # ==========================================================

  determine:

    name: Determine Release Stream

    runs-on: ubuntu-latest

    outputs:
      component: ${{ steps.stream.outputs.component }}
      release_stream: ${{ steps.stream.outputs.release_stream }}

    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0


      - name: Determine stream
        id: stream
        shell: bash

        run: |

          set -euo pipefail

          COMMIT=$(git log -1 --pretty=format:"%s")

          echo "Commit: $COMMIT"


          # --------------------------------------------------
          # Extract Conventional Commit scope.
          #
          # Example:
          #
          # feat(storage): add endpoint
          #
          # Result:
          #
          # storage
          # --------------------------------------------------

          if [[ "$COMMIT" =~ ^[a-zA-Z]+\\(([^)]+)\\)(!)?: ]]; then

            COMPONENT="${BASH_REMATCH[1]}"

          else

            echo "::error::Commit must contain a component scope."

            echo "Example:"
            echo "feat(storage): add private endpoint"

            exit 1

          fi


          # --------------------------------------------------
          # Every component has its own V2 release stream.
          #
          # storage-v2
          # network-v2
          # workflow-v2
          # --------------------------------------------------

          RELEASE_STREAM="${COMPONENT}-v2"

          echo "Component: $COMPONENT"
          echo "Release stream: $RELEASE_STREAM"


          # --------------------------------------------------
          # Verify that the V2 stream already exists.
          #
          # This prevents accidentally creating a new stream.
          # --------------------------------------------------

          if ! git tag --list "${RELEASE_STREAM}.*" | grep -q .; then

            echo "::error::No V2 release tag found for ${RELEASE_STREAM}."

            echo "Expected baseline:"
            echo "${RELEASE_STREAM}.0.0"

            exit 1

          fi


          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          echo "release_stream=$RELEASE_STREAM" >> "$GITHUB_OUTPUT"


  # ==========================================================
  # JOB 2
  # Calculate the next version for ONLY the selected stream.
  # ==========================================================

  version:

    name: Calculate Version

    needs: determine

    uses: ./.github/workflows/version.yml

    with:
      release_stream: ${{ needs.determine.outputs.release_stream }}
      scope: ${{ needs.determine.outputs.component }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}


  # ==========================================================
  # JOB 3
  #
  # Generate custom PR-based release notes.
  #
  # Only:
  #
  # 1. PRs for the selected component
  # 2. PRs merged after the component's previous V2 tag
  #
  # are included.
  #
  # Release notes use ONLY the PR's:
  #
  # ## Summary
  #
  # section.
  # ==========================================================

  release:

    name: Create Release

    needs:
      - determine
      - version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}


    steps:

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0


      # ========================================================
      # GENERATE RELEASE NOTES
      # ========================================================

      - name: Generate release notes

        id: changelog

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ needs.determine.outputs.component }}
          RELEASE_STREAM: ${{ needs.determine.outputs.release_stream }}

        run: |

          set -euo pipefail


          echo "=========================================="
          echo "Generating Release Notes"
          echo "=========================================="

          echo "Component      : $COMPONENT"
          echo "Release stream : $RELEASE_STREAM"


          # ----------------------------------------------------
          # Find the latest tag ONLY for this V2 stream.
          #
          # Example:
          #
          # storage-v2.0.0
          # storage-v2.1.0
          #
          # storage-v1.x.x is ignored.
          # ----------------------------------------------------

          LAST_TAG=$(
            git tag --list "${RELEASE_STREAM}.*" \
              --sort=-v:refname |
            head -n1 || true
          )


          echo "Previous release: ${LAST_TAG:-none}"


          # ----------------------------------------------------
          # Get merged PRs from main.
          # ----------------------------------------------------

          PR_DATA=$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state merged \
              --base main \
              --limit 100 \
              --json number,title,body,mergeCommit,url
          )


          BREAKING_FILE=$(mktemp)
          FEATURES_FILE=$(mktemp)
          FIXES_FILE=$(mktemp)


          touch "$BREAKING_FILE"
          touch "$FEATURES_FILE"
          touch "$FIXES_FILE"


          # ====================================================
          # PROCESS EACH PR
          # ====================================================

          while read -r PR; do

            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            PR_BODY=$(echo "$PR" | jq -r '.body // ""')
            PR_URL=$(echo "$PR" | jq -r '.url')
            MERGE_SHA=$(echo "$PR" | jq -r '.mergeCommit.oid // ""')


            # --------------------------------------------------
            # Ignore PRs without merge commit.
            # --------------------------------------------------

            if [[ -z "$MERGE_SHA" || "$MERGE_SHA" == "null" ]]; then
              continue
            fi


            # --------------------------------------------------
            # Include ONLY PRs for this component.
            #
            # storage:
            #
            # feat(storage): ...
            # fix(storage): ...
            #
            # network PRs are ignored.
            # --------------------------------------------------

            if ! echo "$PR_TITLE" |
              grep -qE \
              "^[a-zA-Z]+\\(${COMPONENT}\\)!?:"
            then
              continue
            fi


            # --------------------------------------------------
            # Include ONLY PRs after the previous release tag.
            #
            # This is what prevents old release history from
            # appearing in the new release notes.
            # --------------------------------------------------

            if [[ -n "$LAST_TAG" ]]; then

              if ! git merge-base \
                --is-ancestor "$LAST_TAG" "$MERGE_SHA" \
                2>/dev/null
              then
                continue
              fi

            fi


            # ==================================================
            # EXTRACT ## Summary FROM PR DESCRIPTION
            # ==================================================

            SUMMARY=$(
              echo "$PR_BODY" |
              awk '
                /^## Summary[[:space:]]*$/ {
                  found=1
                  next
                }

                /^## / {
                  if (found) exit
                }

                found {
                  print
                }
              '
            )


            # Remove empty lines at beginning/end.
            SUMMARY=$(
              echo "$SUMMARY" |
              sed '/^[[:space:]]*$/d'
            )


            # --------------------------------------------------
            # If Summary is missing, use a controlled fallback.
            # --------------------------------------------------

            if [[ -z "$SUMMARY" ]]; then
              SUMMARY="No summary provided in the PR description."
            fi


            # ==================================================
            # BUILD RELEASE NOTE ENTRY
            # ==================================================

            ENTRY="### ${PR_TITLE} (#${PR_NUMBER})"$'\n\n'

            ENTRY+="${SUMMARY}"$'\n\n'

            ENTRY+="[View PR #${PR_NUMBER}](${PR_URL})"$'\n'


            # ==================================================
            # CATEGORIZE PR
            # ==================================================

            if echo "$PR_TITLE" |
              grep -qE \
              "^[a-zA-Z]+\\([^)]*\\)!:"
            then

              printf '%s\n\n' "$ENTRY" >> "$BREAKING_FILE"


            elif echo "$PR_TITLE" |
              grep -qE \
              "^feat\\([^)]*\\):"
            then

              printf '%s\n\n' "$ENTRY" >> "$FEATURES_FILE"


            elif echo "$PR_TITLE" |
              grep -qE \
              "^fix\\([^)]*\\):"
            then

              printf '%s\n\n' "$ENTRY" >> "$FIXES_FILE"

            fi

          done < <(
            echo "$PR_DATA" | jq -c '.[]'
          )


          # ====================================================
          # BUILD FINAL RELEASE NOTES
          # ====================================================

          NOTES_FILE=$(mktemp)


          echo "# ${COMPONENT} V2 Release" >> "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"


          # ----------------------------------------------------
          # Breaking Changes
          # ----------------------------------------------------

          if [[ -s "$BREAKING_FILE" ]]; then

            echo "## ⚠️ Breaking Changes" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$BREAKING_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Features
          # ----------------------------------------------------

          if [[ -s "$FEATURES_FILE" ]]; then

            echo "## 🚀 Features" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$FEATURES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Bug Fixes
          # ----------------------------------------------------

          if [[ -s "$FIXES_FILE" ]]; then

            echo "## 🐛 Bug Fixes" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"

            cat "$FIXES_FILE" >> "$NOTES_FILE"

          fi


          # ----------------------------------------------------
          # Export release notes to GitHub Actions output.
          # ----------------------------------------------------

          {
            echo "changelog<<RELEASE_NOTES_EOF"
            cat "$NOTES_FILE"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"


      # ========================================================
      # CREATE ANNOTATED TAG
      # ========================================================

      - name: Create annotated tag

        id: tag

        shell: bash

        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          BUMP_TYPE: ${{ needs.version.outputs.bump_type }}
          DRY_RUN: ${{ inputs.dry_run }}

        run: |

          set -euo pipefail


          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"


          echo "Next tag: $NEXT_TAG"
          echo "Next version: $NEXT_VERSION"
          echo "Bump type: $BUMP_TYPE"


          if [[ "$DRY_RUN" == "true" ]]; then

            echo "::notice::Dry run - no tag will be created."

            exit 0

          fi


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG"


          git push origin "$NEXT_TAG"


      # ========================================================
      # CREATE GITHUB RELEASE
      #
      # IMPORTANT:
      #
      # --generate-notes is NOT used.
      #
      # We provide our own standardized PR-based notes.
      # ========================================================

      - name: Create GitHub Release

        if: inputs.dry_run == false

        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.changelog }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}

        run: |

          set -euo pipefail


          ARGS=(
            --title "$TAG"
            --notes "$NOTES"
          )


          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi


          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi


          gh release create "$TAG" "${ARGS[@]}"


      # ========================================================
      # GITHUB ACTION SUMMARY
      # ========================================================

      - name: Release summary

        if: always()

        run: |

          {
            echo "## Release Summary"
            echo ""
            echo "- Component: \`${{ needs.determine.outputs.component }}\`"
            echo "- Release stream: \`${{ needs.determine.outputs.release_stream }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Bump type: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Released tag: \`${{ needs.version.outputs.next_tag }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"