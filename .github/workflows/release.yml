
name: Release

# -----------------------------------------------------------------------------
# Reusable release workflow.
#
# VERSIONING
# ----------
# The commit message is passed from release-workflow.yml.
# version.yml is the single source of truth for version calculation.
#
# PR title and PR description are NOT used for versioning.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      commit_message:
        description: "Conventional Commit message used for versioning"
        required: true
        type: string

      tag_prefix:
        description: "Default release tag prefix"
        required: false
        type: string
        default: "v"

      initial_version:
        description: "Initial version"
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Version bump: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"

      dry_run:
        description: "Preview only"
        required: false
        type: boolean
        default: false

      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: false

      prerelease:
        description: "Create prerelease"
        required: false
        type: boolean
        default: false

    outputs:

      released_version:
        description: "Released version"
        value: ${{ jobs.release.outputs.released_version }}

      released_tag:
        description: "Released Git tag"
        value: ${{ jobs.release.outputs.released_tag }}

      bump_type:
        description: "Version bump"
        value: ${{ jobs.version.outputs.bump_type }}


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------

permissions:
  contents: write


# -----------------------------------------------------------------------------
# Calculate version
# -----------------------------------------------------------------------------

jobs:

  version:

    name: Calculate Version

    uses: ./.github/workflows/version.yml

    with:
      commit_message: ${{ inputs.commit_message }}
      tag_prefix: ${{ inputs.tag_prefix }}
      initial_version: ${{ inputs.initial_version }}
      bump_override: ${{ inputs.bump_override }}

    secrets: inherit


  # ---------------------------------------------------------------------------
  # Create tag and GitHub Release
  # ---------------------------------------------------------------------------

  release:

    name: Create Release

    needs: version

    if: needs.version.outputs.has_changes == 'true'

    runs-on: ubuntu-latest

    outputs:

      released_version: ${{ steps.tag.outputs.version }}

      released_tag: ${{ steps.tag.outputs.tag }}


    steps:

      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Configure Git
      # -----------------------------------------------------------------------

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # -----------------------------------------------------------------------
      # Create annotated tag
      # -----------------------------------------------------------------------

      - name: Create annotated tag
        id: tag
        shell: bash
        env:
          NEXT_TAG: ${{ needs.version.outputs.next_tag }}
          NEXT_VERSION: ${{ needs.version.outputs.next_version }}
          DRY_RUN: ${{ inputs.dry_run }}

        run: |
          set -euo pipefail

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

          echo "::group::Release Information"
          echo "Commit      : ${{ inputs.commit_message }}"
          echo "Scope       : ${{ needs.version.outputs.release_scope || 'repo-wide' }}"
          echo "Bump        : ${{ needs.version.outputs.bump_type }}"
          echo "Version     : ${NEXT_VERSION}"
          echo "Tag         : ${NEXT_TAG}"
          echo "::endgroup::"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::Dry run - tag ${NEXT_TAG} would be created."
            exit 0
          fi

          # Prevent duplicate tag creation.
          if git rev-parse "$NEXT_TAG" >/dev/null 2>&1; then
            echo "::error::Tag already exists: ${NEXT_TAG}"
            exit 1
          fi

          git tag -a "$NEXT_TAG" \
            -m "Release $NEXT_TAG" \
            HEAD

          git push origin "$NEXT_TAG"


      # -----------------------------------------------------------------------
      # Create GitHub Release
      # -----------------------------------------------------------------------

      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}

        run: |
          set -euo pipefail

          ARGS=(
            "$TAG"
            --title "$TAG"
            --generate-notes
          )

          if [[ "$DRAFT" == "true" ]]; then
            ARGS+=(--draft)
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"


      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Release Summary"
            echo
            echo "- Commit: \`${{ inputs.commit_message }}\`"
            echo "- Scope: \`${{ needs.version.outputs.release_scope || 'repo-wide' }}\`"
            echo "- Bump: \`${{ needs.version.outputs.bump_type }}\`"
            echo "- Previous version: \`${{ needs.version.outputs.current_version }}\`"
            echo "- Next version: \`${{ needs.version.outputs.next_version }}\`"
            echo "- Tag: \`${{ steps.tag.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
