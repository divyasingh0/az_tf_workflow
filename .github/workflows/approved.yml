name: Reusable - Promote Plan On Merge

on:
  # ---------------------------------------------------------------------------
  # Automatic release
  # ---------------------------------------------------------------------------
  push:
    branches:
      - main


# on:
#   workflow_call:
#     inputs:
#       application:
#         required: true
#         type: string
#       environment:
#         required: true
#         type: string
#       workflow_file:
#         description: "Filename of the caller PR workflow that produced the plan, e.g. app1-pr.yml"
#         required: true
#         type: string
#       head_sha:
#         description: "The merged PR's head commit SHA — the exact commit that was planned and reviewed"
#         required: true
#         type: string
#       azure_client_id:
#         required: true
#         type: string
#       azure_tenant_id:
#         required: true
#         type: string
#       azure_subscription_id:
#         required: true
#         type: string
#       tfplan_storage_account:
#         required: true
#         type: string
#       tfplan_container:
#         required: false
#         type: string
#         default: "tfplans"

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  promote:
    name: Promote Approved Plan (${{ inputs.application }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the PR's plan workflow run for this exact commit
        id: find_run
        uses: actions/github-script@v7
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const wf = workflows.workflows.find(w => w.path.endsWith("${{ inputs.workflow_file }}"));
            if (!wf) {
              core.setFailed(`Could not find workflow file matching ${{ inputs.workflow_file }}`);
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: wf.id,
              head_sha: "${{ inputs.head_sha }}",
              status: "success",
              per_page: 10
            });

            if (runs.total_count === 0) {
              core.setFailed(`No successful run of ${{ inputs.workflow_file }} was found for commit ${{ inputs.head_sha }}. The plan may have never run, may have failed, or its artifact may have already expired.`);
              return;
            }

            // Most recent successful run for this exact commit
            const run = runs.workflow_runs[0];
            core.setOutput('run_id', String(run.id));

      - name: Resolve plan artifact from that run
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ steps.find_run.outputs.run_id }};
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const match = data.artifacts.find(a =>
              a.name.startsWith(`tfplan-${{ inputs.application }}-${{ inputs.environment }}-`) && !a.expired
            );
            if (!match) {
              core.setFailed(`No valid, non-expired plan artifact found in run ${runId} for application=${{ inputs.application }} environment=${{ inputs.environment }}. If the PR review took longer than the artifact's retention window, re-run the PR plan workflow before merging.`);
              return;
            }
            core.setOutput('artifact_name', match.name);

      - name: Download the reviewed plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ steps.find_run.outputs.run_id }}

      - name: Validate this plan actually matches the merged commit
        run: |
          set -euo pipefail
          APP=$(jq -r '.application' metadata.json)
          ENV=$(jq -r '.environment' metadata.json)
          SHA=$(jq -r '.commit_sha' metadata.json)

          if [ "$APP" != "${{ inputs.application }}" ] || [ "$ENV" != "${{ inputs.environment }}" ]; then
            echo "::error::metadata mismatch (application=$APP, environment=$ENV). Refusing to promote."
            exit 1
          fi

          if [ "$SHA" != "${{ inputs.head_sha }}" ]; then
            echo "::error::Stored plan was generated for commit $SHA, but the merged PR head commit is ${{ inputs.head_sha }}. This usually means new commits were pushed after the last plan ran. Refusing to promote a plan that does not match what was actually merged."
            exit 1
          fi

          echo "Verified: plan for commit ${SHA} matches merged PR head commit. Safe to promote."

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Copy approved plan to permanent central storage (immutable)
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ inputs.head_sha }}" | cut -c1-7)
          DEST="${{ inputs.application }}/${{ inputs.environment }}/${SHORT_SHA}"

          for FILE in tfplan metadata.json; do
            EXISTS=$(az storage blob exists \
              --account-name "${{ inputs.tfplan_storage_account }}" \
              --container-name "${{ inputs.tfplan_container }}" \
              --name "${DEST}/${FILE}" \
              --auth-mode login --query exists -o tsv)

            if [ "$EXISTS" = "true" ]; then
              echo "::error::${DEST}/${FILE} already exists. Refusing to overwrite an immutable, already-promoted plan."
              exit 1
            fi

            az storage blob upload \
              --account-name "${{ inputs.tfplan_storage_account }}" \
              --container-name "${{ inputs.tfplan_container }}" \
              --name "${DEST}/${FILE}" \
              --file "${FILE}" \
              --auth-mode login
          done

      - name: Write latest-approved.json pointer
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ inputs.head_sha }}" | cut -c1-7)
          cat <<EOF > latest-approved.json
          {
            "application": "${{ inputs.application }}",
            "environment": "${{ inputs.environment }}",
            "commit_sha": "${SHORT_SHA}",
            "approved_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "merged_by": "${{ github.actor }}"
          }
          EOF
          az storage blob upload \
            --account-name "${{ inputs.tfplan_storage_account }}" \
            --container-name "${{ inputs.tfplan_container }}" \
            --name "${{ inputs.application }}/${{ inputs.environment }}/latest-approved.json" \
            --file latest-approved.json \
            --auth-mode login \
            --overwrite true