name: release-trigger

# Entry point for the release process.
#
# TESTING:
#   workflow-v2.0.0
#   workflow-v2.1.0
#
#   release-v2.0.0
#   release-v2.1.0
#
# Each tag prefix has its own independent version history.

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:

      tag_prefix:
        description: "Release tag prefix to test"
        required: true
        type: choice
        options:
          - workflow-v
          - release-v
        default: workflow-v

      initial_version:
        description: "Initial version used when no tag exists for the selected prefix"
        required: true
        type: string
        default: "2.0.0"

      bump_override:
        description: "Force a version bump"
        required: true
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

      dry_run:
        description: "Preview release without creating tag or GitHub Release"
        required: true
        type: boolean
        default: false

      draft:
        description: "Create GitHub Release as draft"
        required: true
        type: boolean
        default: false

      prerelease:
        description: "Create GitHub Release as prerelease"
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  pull-requests: read

jobs:

  release:
    name: Release

    uses: ./.github/workflows/release.yml

    with:

      # ----------------------------------------------------------------------
      # TAG STREAM
      # ----------------------------------------------------------------------
      #
      # Manual testing:
      #
      # workflow-v
      #   -> workflow-v2.0.0
      #   -> workflow-v2.1.0
      #
      # release-v
      #   -> release-v2.0.0
      #   -> release-v2.1.0
      #
      tag_prefix: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.tag_prefix
            || vars.RELEASE_TAG_PREFIX
            || 'workflow-v' }}

      # ----------------------------------------------------------------------
      # INITIAL VERSION
      # ----------------------------------------------------------------------

      initial_version: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.initial_version
            || vars.RELEASE_INITIAL_VERSION
            || '2.0.0' }}

      # ----------------------------------------------------------------------
      # VERSION BUMP
      # ----------------------------------------------------------------------

      bump_override: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.bump_override
            || 'auto' }}

      # ----------------------------------------------------------------------
      # TESTING OPTIONS
      # ----------------------------------------------------------------------

      dry_run: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.dry_run
            || false }}

      draft: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.draft
            || false }}

      prerelease: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.prerelease
            || false }}

    secrets: inherit
