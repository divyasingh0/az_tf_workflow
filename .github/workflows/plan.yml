name: Reusable - Terraform Plan

# on:



on:
  # ---------------------------------------------------------------------------
  # Automatic release
  # ---------------------------------------------------------------------------
  push:
    branches:
      - main

  # workflow_call:
  #   inputs:
  #     application:
  #       required: true
  #       type: string
  #     environment:
  #       required: true
  #       type: string
  #     working_directory:
  #       required: true
  #       type: string
  #     check_only:
  #       required: false
  #       type: boolean
  #       default: false
  #     terraform_version:
  #       required: false
  #       type: string
  #       default: "1.9.5"
  #     azure_client_id:
  #       required: true
  #       type: string
  #     azure_tenant_id:
  #       required: true
  #       type: string
  #     azure_subscription_id:
  #       required: true
  #       type: string
  #     backend_resource_group:
  #       required: true
  #       type: string
  #     backend_storage_account:
  #       required: true
  #       type: string
  #     backend_container:
  #       required: true
  #       type: string
  #     backend_key:
  #       required: true
  #       type: string
  #     transport_retention_days:
  #       description: "How long the pre-merge plan artifact survives. Must comfortably cover your expected PR review/approval SLA — if a PR takes longer to merge than this, the plan expires before it can be promoted."
  #       required: false
  #       type: number
  #       default: 14

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ inputs.application }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform Plan (${{ inputs.application }} / ${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Azure login (OIDC, plan-scoped identity)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ inputs.backend_resource_group }}" \
            -backend-config="storage_account_name=${{ inputs.backend_storage_account }}" \
            -backend-config="container_name=${{ inputs.backend_container }}" \
            -backend-config="key=${{ inputs.backend_key }}"

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Stop here (check-only mode)
        if: ${{ inputs.check_only }}
        run: echo "check_only=true — fmt and validate passed. Skipping plan."

      - name: Terraform plan
        if: ${{ !inputs.check_only }}
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan JSON and text summary
        if: ${{ !inputs.check_only }}
        run: |
          terraform show -json tfplan > plan.json
          terraform show -no-color tfplan > plan.txt

      - name: Generate metadata.json
        if: ${{ !inputs.check_only }}
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          cat <<EOF > metadata.json
          {
            "repository": "${{ github.repository }}",
            "pull_request_number": "${{ github.event.pull_request.number }}",
            "commit_sha": "${{ github.sha }}",
            "short_sha": "${SHORT_SHA}",
            "application": "${{ inputs.application }}",
            "environment": "${{ inputs.environment }}",
            "terraform_version": "${{ inputs.terraform_version }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload transport artifact (pre-merge — NOT yet the system of record)
        if: ${{ !inputs.check_only }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.application }}-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            ${{ inputs.working_directory }}/tfplan
            ${{ inputs.working_directory }}/metadata.json
            ${{ inputs.working_directory }}/plan.json
          retention-days: ${{ inputs.transport_retention_days }}
          if-no-files-found: error
        # NOTE: This plan is NOT copied to Azure Storage here. It only becomes
        # permanent, promoted, and eligible for deployment if and when this PR
        # is actually merged — see reusable-promote-on-merge.yml.

      - name: Comment plan summary on PR
        if: ${{ !inputs.check_only && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join(process.env.GITHUB_WORKSPACE, '${{ inputs.working_directory }}', 'plan.txt');
            let plan = fs.readFileSync(planPath, 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform Plan — \`${{ inputs.application }}\` / \`${{ inputs.environment }}\`\n\nThis plan is held as a temporary build artifact and will only be promoted to permanent, deployable storage if this PR is approved and merged.\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });