name: Terraform PR Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  ENVIRONMENT: dev
  WORKING_DIRECTORY: .

# ---------------------------------------------------------------------------
# Prevent overlapping Terraform operations for the same environment.
# Existing run is allowed to finish.
# ---------------------------------------------------------------------------
concurrency:
  group: terraform-${{ github.repository }}-${{ env.ENVIRONMENT }}
  cancel-in-progress: false

jobs:

  # ===========================================================================
  # VALIDATE
  # ===========================================================================
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Read Terraform Version
      # -----------------------------------------------------------------------
      - name: Read Terraform Version
        id: tf_version
        run: |
          echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf_version.outputs.version }}

      # -----------------------------------------------------------------------
      # Validate Environment Files
      # -----------------------------------------------------------------------
      - name: Validate Environment Files
        run: |
          test -f environment/${{ env.ENVIRONMENT }}/backend.tfvars
          test -f environment/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.tfvars

      # -----------------------------------------------------------------------
      # Azure Login
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

          terraform init \
            -backend-config=environment/${{ env.ENVIRONMENT }}/backend.tfvars \
            -input=false

      # -----------------------------------------------------------------------
      # Terraform Format
      # -----------------------------------------------------------------------
      - name: Terraform FMT
        run: terraform fmt -check -recursive

      # -----------------------------------------------------------------------
      # Terraform Validate
      # -----------------------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


  # ===========================================================================
  # PLAN
  # ===========================================================================
  plan:
    name: Terraform Plan
    needs: validate

    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Read Terraform Version
      # -----------------------------------------------------------------------
      - name: Read Terraform Version
        id: tf_version
        run: |
          echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf_version.outputs.version }}

      # -----------------------------------------------------------------------
      # Azure Login
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Terraform Init
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

          terraform init \
            -backend-config=environment/${{ env.ENVIRONMENT }}/backend.tfvars \
            -input=false

      # -----------------------------------------------------------------------
      # Workflow Metadata
      # -----------------------------------------------------------------------
      - name: Generate Workflow Metadata
        run: |
          cat > workflow.auto.tfvars.json << EOF
          {
            "workflow_tags": {
              "repository": "${GITHUB_REPOSITORY}"
            }
          }
          EOF

      # -----------------------------------------------------------------------
      # Terraform Plan
      # -----------------------------------------------------------------------
      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=environment/${{ env.ENVIRONMENT }}/${{ env.ENVIRONMENT }}.tfvars \
            -out=tfplan

      # -----------------------------------------------------------------------
      # Human-readable plan
      # -----------------------------------------------------------------------
      - name: Generate Plan Output
        run: |
          terraform show -no-color tfplan > tfplan.txt

      # -----------------------------------------------------------------------
      # Plan Metadata
      #
      # The commit_sha is the EXACT commit for which the plan was generated.
      # -----------------------------------------------------------------------
      - name: Generate Plan Metadata
        run: |
          cat > plan-metadata.json << EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "environment": "${{ env.ENVIRONMENT }}",
            "commit_sha": "${GITHUB_SHA}",
            "pull_request_number": "${{ github.event.pull_request.number }}",
            "pull_request_url": "${{ github.event.pull_request.html_url }}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_number": "${GITHUB_RUN_NUMBER}",
            "terraform_version": "${{ steps.tf_version.outputs.version }}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      # -----------------------------------------------------------------------
      # Plan Integrity
      # -----------------------------------------------------------------------
      - name: Generate Plan Checksum
        run: |
          sha256sum tfplan > tfplan.sha256

      # -----------------------------------------------------------------------
      # Prepare Candidate Artifact
      # -----------------------------------------------------------------------
      - name: Prepare Plan Artifact
        run: |
          mkdir -p terraform-plan-artifact

          cp tfplan terraform-plan-artifact/
          cp tfplan.txt terraform-plan-artifact/
          cp tfplan.sha256 terraform-plan-artifact/
          cp plan-metadata.json terraform-plan-artifact/

      # -----------------------------------------------------------------------
      # Upload Candidate Artifact to GitHub
      # -----------------------------------------------------------------------
      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.ENVIRONMENT }}-${{ github.sha }}
          path: terraform-plan-artifact/
          retention-days: 30
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Generate Plan Summary
        run: |
          echo "### Terraform Plan Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repository: $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ env.ENVIRONMENT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: terraform-plan-${{ env.ENVIRONMENT }}-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"