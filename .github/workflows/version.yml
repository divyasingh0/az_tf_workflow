
name: release-version

# -----------------------------------------------------------------------------
# Reusable workflow for calculating the next semantic version.
#
# VERSIONING STRATEGY
# -------------------
# Versioning is based ONLY on the Conventional Commit message.
#
# PR title is NOT used for version calculation.
# PR title is used separately by release.yml for release notes.
#
# Examples:
#
#   feat(workflow): add release automation
#       -> workflow-v2.1.0
#
#   fix(workflow): fix release workflow
#       -> workflow-v2.1.1
#
#   feat(release): improve release process
#       -> release-v2.1.0
#
#   feat: common repository change
#       -> v2.1.0
#
#   fix: common repository fix
#       -> v2.0.1
#
# The scope determines the release stream:
#
#   workflow  -> workflow-vX.Y.Z
#   release   -> release-vX.Y.Z
#   no scope  -> vX.Y.Z
#
# Only the matching tag stream is used to calculate the next version.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      # -----------------------------------------------------------------------
      # Default tag prefix
      #
      # Used when the Conventional Commit has NO scope.
      #
      # Example:
      #   feat: update common workflow
      #   -> v2.1.0
      # -----------------------------------------------------------------------
      tag_prefix:
        description: "Default release tag prefix"
        required: false
        type: string
        default: "v"

      # -----------------------------------------------------------------------
      # Initial version
      # -----------------------------------------------------------------------
      initial_version:
        description: "Baseline version when no previous release tag exists"
        required: false
        type: string
        default: "0.1.0"

      # -----------------------------------------------------------------------
      # Manual version bump override
      # -----------------------------------------------------------------------
      bump_override:
        description: "Override automatic version detection: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"

    # -------------------------------------------------------------------------
    # Outputs
    # -------------------------------------------------------------------------
    outputs:

      current_version:
        description: "Latest version for the selected release stream"
        value: ${{ jobs.compute-version.outputs.current_version }}

      next_version:
        description: "Next semantic version"
        value: ${{ jobs.compute-version.outputs.next_version }}

      next_tag:
        description: "Next Git tag"
        value: ${{ jobs.compute-version.outputs.next_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.compute-version.outputs.bump_type }}

      has_changes:
        description: "Whether a release is required"
        value: ${{ jobs.compute-version.outputs.has_changes }}

      release_scope:
        description: "Conventional Commit scope"
        value: ${{ jobs.compute-version.outputs.release_scope }}

      release_tag_prefix:
        description: "Release tag prefix"
        value: ${{ jobs.compute-version.outputs.release_tag_prefix }}

      commit_message:
        description: "Commit message used for versioning"
        value: ${{ jobs.compute-version.outputs.commit_message }}


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: read


jobs:

  # ============================================================================
  # Calculate release version
  # ============================================================================
  compute-version:
    name: Calculate Version
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}
      release_scope: ${{ steps.semver.outputs.release_scope }}
      release_tag_prefix: ${{ steps.semver.outputs.release_tag_prefix }}
      commit_message: ${{ steps.semver.outputs.commit_message }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Calculate semantic version
      # -----------------------------------------------------------------------
      - name: Calculate semantic version
        id: semver
        shell: bash
        env:
          DEFAULT_TAG_PREFIX: ${{ inputs.tag_prefix }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}
        run: |
          set -euo pipefail

          # =====================================================================
          # STEP 1 - Get the commit message
          #
          # IMPORTANT:
          # Versioning is based ONLY on the commit message.
          # PR title is intentionally NOT used here.
          # =====================================================================

          COMMIT_MESSAGE="$(git log -1 --pretty=format:"%s")"

          echo "::group::Commit Information"
          echo "Commit message: ${COMMIT_MESSAGE}"
          echo "::endgroup::"


          # =====================================================================
          # STEP 2 - Parse Conventional Commit
          #
          # Supported:
          #
          #   feat(workflow): add feature
          #   fix(workflow): fix issue
          #   feat(workflow)!: breaking change
          #   feat: common change
          #   fix: common fix
          #
          # =====================================================================

          COMMIT_TYPE=""
          COMMIT_SCOPE=""
          BREAKING="false"

          # Remove leading/trailing whitespace
          COMMIT_MESSAGE="$(echo "$COMMIT_MESSAGE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"


          if [[ "$COMMIT_MESSAGE" =~ ^([a-zA-Z]+)(\(([a-zA-Z0-9._-]+)\))?(!)?:[[:space:]]*(.+)$ ]]; then

            COMMIT_TYPE="${BASH_REMATCH[1]}"
            COMMIT_SCOPE="${BASH_REMATCH[3]:-}"

            if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
              BREAKING="true"
            fi

          else

            echo "::notice::Commit does not follow Conventional Commit format."
            echo "::notice::Expected format: feat(workflow): description"
            echo "::notice::No release will be created."

            {
              echo "has_changes=false"
              echo "current_version=$INITIAL_VERSION"
              echo "next_version=$INITIAL_VERSION"
              echo "next_tag=${DEFAULT_TAG_PREFIX}${INITIAL_VERSION}"
              echo "bump_type=none"
              echo "release_scope="
              echo "release_tag_prefix=${DEFAULT_TAG_PREFIX}"
              echo "commit_message<<EOF"
              echo "$COMMIT_MESSAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          echo "::group::Conventional Commit"
          echo "Type      : ${COMMIT_TYPE}"
          echo "Scope     : ${COMMIT_SCOPE:-none}"
          echo "Breaking  : ${BREAKING}"
          echo "::endgroup::"


          # =====================================================================
          # STEP 3 - Determine release stream
          #
          # Scoped commit:
          #
          #   feat(workflow): ...
          #       -> workflow-v
          #
          #   feat(release): ...
          #       -> release-v
          #
          # Unscoped commit:
          #
          #   feat: ...
          #       -> v
          #
          # =====================================================================

          if [[ -n "$COMMIT_SCOPE" ]]; then

            RELEASE_SCOPE="$COMMIT_SCOPE"
            RELEASE_TAG_PREFIX="${COMMIT_SCOPE}-${DEFAULT_TAG_PREFIX}"

          else

            RELEASE_SCOPE=""
            RELEASE_TAG_PREFIX="$DEFAULT_TAG_PREFIX"

          fi


          echo "::group::Release Stream"
          echo "Commit scope : ${COMMIT_SCOPE:-none}"
          echo "Release scope: ${RELEASE_SCOPE:-default}"
          echo "Tag prefix   : ${RELEASE_TAG_PREFIX}"
          echo "::endgroup::"


          # =====================================================================
          # STEP 4 - Find latest tag ONLY for this release stream
          #
          # Example:
          #
          #   workflow-v2.3.0
          #   workflow-v2.2.0
          #   release-v2.5.0
          #   release-v2.4.0
          #   v2.1.0
          #
          # For:
          #
          #   feat(workflow): ...
          #
          # ONLY workflow-v* is considered.
          # =====================================================================

          LAST_TAG=$(
            git tag --list "${RELEASE_TAG_PREFIX}[0-9]*" \
              --sort=-v:refname |
            head -n 1 || true
          )


          # =====================================================================
          # STEP 5 - Determine current version
          # =====================================================================

          if [[ -z "$LAST_TAG" ]]; then

            CURRENT_VERSION="$INITIAL_VERSION"

            echo "::notice::No previous tag found for '${RELEASE_TAG_PREFIX}'."
            echo "::notice::Starting from ${INITIAL_VERSION}."

          else

            CURRENT_VERSION="${LAST_TAG#"$RELEASE_TAG_PREFIX"}"

          fi


          echo "::group::Current Release"
          echo "Latest tag     : ${LAST_TAG:-none}"
          echo "Current version: ${CURRENT_VERSION}"
          echo "::endgroup::"


          # =====================================================================
          # STEP 6 - Determine version bump
          # =====================================================================

          HAS_CHANGES="true"

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            case "$BUMP_OVERRIDE" in

              major|minor|patch)
                BUMP="$BUMP_OVERRIDE"
                ;;

              *)
                echo "::error::Invalid bump_override: ${BUMP_OVERRIDE}"
                exit 1
                ;;

            esac

          elif [[ "$BREAKING" == "true" ]]; then

            BUMP="major"

          elif [[ "$COMMIT_TYPE" == "feat" ]]; then

            BUMP="minor"

          elif [[ "$COMMIT_TYPE" == "fix" ]]; then

            BUMP="patch"

          elif [[ "$COMMIT_TYPE" == "breaking" ]]; then

            BUMP="major"

          else

            # chore, docs, refactor, style, test, ci, etc.
            # do not create a release automatically.

            echo "::notice::Commit type '${COMMIT_TYPE}' does not trigger a release."

            HAS_CHANGES="false"
            BUMP="none"

          fi


          # =====================================================================
          # STEP 7 - No release required
          # =====================================================================

          if [[ "$HAS_CHANGES" == "false" ]]; then

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${RELEASE_TAG_PREFIX}${CURRENT_VERSION}"
              echo "bump_type=none"
              echo "release_scope=$RELEASE_SCOPE"
              echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
              echo "commit_message<<EOF"
              echo "$COMMIT_MESSAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # =====================================================================
          # STEP 8 - Calculate next semantic version
          # =====================================================================

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"


          # Validate semantic version
          if ! [[ "$MAJOR" =~ ^[0-9]+$ &&
                  "$MINOR" =~ ^[0-9]+$ &&
                  "$PATCH" =~ ^[0-9]+$ ]]; then

            echo "::error::Invalid semantic version: ${CURRENT_VERSION}"
            exit 1

          fi


          case "$BUMP" in

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;

          esac


          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="${RELEASE_TAG_PREFIX}${NEXT_VERSION}"


          # =====================================================================
          # STEP 9 - Outputs
          # =====================================================================

          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
            echo "release_scope=$RELEASE_SCOPE"
            echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
            echo "commit_message<<EOF"
            echo "$COMMIT_MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


          # =====================================================================
          # STEP 10 - GitHub Actions summary
          # =====================================================================

          {
            echo "## Release Calculation"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Commit message | ${COMMIT_MESSAGE} |"
            echo "| Commit type | ${COMMIT_TYPE} |"
            echo "| Commit scope | ${COMMIT_SCOPE:-none} |"
            echo "| Release scope | ${RELEASE_SCOPE:-default} |"
            echo "| Release tag prefix | ${RELEASE_TAG_PREFIX} |"
            echo "| Previous tag | ${LAST_TAG:-none} |"
            echo "| Current version | ${CURRENT_VERSION} |"
            echo "| Bump type | ${BUMP} |"
            echo "| Next version | ${NEXT_VERSION} |"
            echo "| Next tag | ${NEXT_TAG} |"
          } >> "$GITHUB_STEP_SUMMARY"
