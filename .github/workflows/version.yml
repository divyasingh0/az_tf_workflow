
name: release-version

# -----------------------------------------------------------------------------
# Reusable workflow for calculating the next semantic version.
#
# VERSIONING SOURCE OF TRUTH
# --------------------------
# The commit_message input is the ONLY source of truth for versioning.
#
# Examples:
#
#   feat(workflow): add release automation
#       -> workflow-v2.1.0
#
#   fix(workflow): fix release workflow
#       -> workflow-v2.0.1
#
#   feat(workflow)!: breaking change
#       -> workflow-v3.0.0
#
#   feat: common feature
#       -> v2.1.0
#
# PR title and PR description are NOT used.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      commit_message:
        description: "Conventional Commit message used for versioning"
        required: true
        type: string

      tag_prefix:
        description: "Default tag prefix when commit has no scope"
        required: false
        type: string
        default: "v"

      initial_version:
        description: "Initial version when no previous tag exists"
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Version bump: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"

    outputs:

      current_version:
        description: "Current version"
        value: ${{ jobs.compute-version.outputs.current_version }}

      next_version:
        description: "Next semantic version"
        value: ${{ jobs.compute-version.outputs.next_version }}

      next_tag:
        description: "Next Git tag"
        value: ${{ jobs.compute-version.outputs.next_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.compute-version.outputs.bump_type }}

      has_changes:
        description: "Whether a release is required"
        value: ${{ jobs.compute-version.outputs.has_changes }}

      release_scope:
        description: "Conventional Commit scope"
        value: ${{ jobs.compute-version.outputs.release_scope }}

      release_tag_prefix:
        description: "Release tag prefix"
        value: ${{ jobs.compute-version.outputs.release_tag_prefix }}


permissions:
  contents: read


jobs:

  compute-version:

    name: Calculate Version

    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}
      release_scope: ${{ steps.semver.outputs.release_scope }}
      release_tag_prefix: ${{ steps.semver.outputs.release_tag_prefix }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout repository so Git tags are available.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Calculate semantic version.
      # -----------------------------------------------------------------------
      - name: Calculate semantic version
        id: semver
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          DEFAULT_TAG_PREFIX: ${{ inputs.tag_prefix }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}

        run: |
          set -euo pipefail

          # ===================================================================
          # STEP 1 - Get commit message supplied by release-workflow.yml
          # ===================================================================

          COMMIT_MESSAGE="$(echo "$COMMIT_MESSAGE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          echo "::group::Commit Information"
          echo "Commit message: ${COMMIT_MESSAGE}"
          echo "::endgroup::"

          if [[ -z "$COMMIT_MESSAGE" ]]; then
            echo "::error::Commit message is empty."
            exit 1
          fi


          # ===================================================================
          # STEP 2 - Parse Conventional Commit
          # ===================================================================

          COMMIT_TYPE=""
          COMMIT_SCOPE=""
          BREAKING="false"

          if [[ "$COMMIT_MESSAGE" =~ ^([a-zA-Z]+)(\(([a-zA-Z0-9._/-]+)\))?(!)?:[[:space:]]*(.+)$ ]]; then

            COMMIT_TYPE="${BASH_REMATCH[1]}"
            COMMIT_SCOPE="${BASH_REMATCH[3]:-}"

            if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
              BREAKING="true"
            fi

          else

            echo "::error::Commit does not follow Conventional Commit format."
            echo "::error::Expected format: feat(workflow): description"
            echo "::error::Received: ${COMMIT_MESSAGE}"

            exit 1

          fi


          echo "::group::Conventional Commit"
          echo "Type     : ${COMMIT_TYPE}"
          echo "Scope    : ${COMMIT_SCOPE:-none}"
          echo "Breaking : ${BREAKING}"
          echo "::endgroup::"


          # ===================================================================
          # STEP 3 - Determine release stream
          # ===================================================================

          if [[ -n "$COMMIT_SCOPE" ]]; then

            RELEASE_SCOPE="$COMMIT_SCOPE"
            RELEASE_TAG_PREFIX="${COMMIT_SCOPE}-${DEFAULT_TAG_PREFIX}"

          else

            RELEASE_SCOPE=""
            RELEASE_TAG_PREFIX="$DEFAULT_TAG_PREFIX"

          fi


          echo "::group::Release Stream"
          echo "Release scope: ${RELEASE_SCOPE:-default}"
          echo "Tag prefix   : ${RELEASE_TAG_PREFIX}"
          echo "::endgroup::"


          # ===================================================================
          # STEP 4 - Find latest tag for this release stream
          # ===================================================================

          LAST_TAG=$(
            git tag --list "${RELEASE_TAG_PREFIX}[0-9]*" \
              --sort=-v:refname |
            head -n 1 || true
          )


          # ===================================================================
          # STEP 5 - Determine current version
          # ===================================================================

          if [[ -z "$LAST_TAG" ]]; then

            CURRENT_VERSION="$INITIAL_VERSION"

            echo "::notice::No previous tag found for ${RELEASE_TAG_PREFIX}"
            echo "::notice::Starting from ${INITIAL_VERSION}"

          else

            CURRENT_VERSION="${LAST_TAG#"$RELEASE_TAG_PREFIX"}"

          fi


          # ===================================================================
          # STEP 6 - Determine version bump
          # ===================================================================

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            case "$BUMP_OVERRIDE" in
              major|minor|patch)
                BUMP="$BUMP_OVERRIDE"
                ;;
              *)
                echo "::error::Invalid bump_override: ${BUMP_OVERRIDE}"
                exit 1
                ;;
            esac

          elif [[ "$BREAKING" == "true" ]]; then

            BUMP="major"

          elif [[ "$COMMIT_TYPE" == "feat" ]]; then

            BUMP="minor"

          elif [[ "$COMMIT_TYPE" == "fix" ]]; then

            BUMP="patch"

          else

            echo "::notice::Commit type '${COMMIT_TYPE}' does not trigger a release."

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${RELEASE_TAG_PREFIX}${CURRENT_VERSION}"
              echo "bump_type=none"
              echo "release_scope=$RELEASE_SCOPE"
              echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ===================================================================
          # STEP 7 - Calculate next version
          # ===================================================================

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if ! [[ "$MAJOR" =~ ^[0-9]+$ &&
                  "$MINOR" =~ ^[0-9]+$ &&
                  "$PATCH" =~ ^[0-9]+$ ]]; then

            echo "::error::Invalid semantic version: ${CURRENT_VERSION}"
            exit 1
          fi


          case "$BUMP" in

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;

          esac


          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="${RELEASE_TAG_PREFIX}${NEXT_VERSION}"


          # ===================================================================
          # STEP 8 - Outputs
          # ===================================================================

          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
            echo "release_scope=$RELEASE_SCOPE"
            echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
          } >> "$GITHUB_OUTPUT"


          # ===================================================================
          # STEP 9 - Summary
          # ===================================================================

          {
            echo "## Release Calculation"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Commit message | ${COMMIT_MESSAGE} |"
            echo "| Commit type | ${COMMIT_TYPE} |"
            echo "| Commit scope | ${COMMIT_SCOPE:-none} |"
            echo "| Release tag prefix | ${RELEASE_TAG_PREFIX} |"
            echo "| Previous tag | ${LAST_TAG:-none} |"
            echo "| Current version | ${CURRENT_VERSION} |"
            echo "| Bump type | ${BUMP} |"
            echo "| Next version | ${NEXT_VERSION} |"
            echo "| Next tag | ${NEXT_TAG} |"
          } >> "$GITHUB_STEP_SUMMARY"
name: release-version

# Reusable workflow: computes the next SemVer version from Conventional Commits.
# Supports monorepo "scoped" components (e.g. compute, network, storage) via
# the `scope` input, matched against Conventional Commit scopes like fix(compute): ...

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Prefix used for git tags, e.g. 'v' -> v1.2.3"
        required: false
        type: string
        default: "v"
      scope:
        description: "Conventional commit scope this component reacts to, e.g. 'compute'. Empty = repo-wide, any scope counts."
        required: false
        type: string
        default: ""
      initial_version:
        description: "Baseline version used when no prior tag exists"
        required: false
        type: string
        default: "0.1.0"
      bump_override:
        description: "Force a bump instead of auto-detecting: auto|major|minor|patch"
        required: false
        type: string
        default: "auto"
    outputs:
      current_version:
        description: "Latest released version (no prefix). Equals initial_version if no tags exist."
        value: ${{ jobs.compute.outputs.current_version }}
      next_version:
        description: "Computed next version (no prefix)"
        value: ${{ jobs.compute.outputs.next_version }}
      next_tag:
        description: "Computed next version WITH prefix, e.g. v1.3.0"
        value: ${{ jobs.compute.outputs.next_tag }}
      bump_type:
        description: "major | minor | patch | none"
        value: ${{ jobs.compute.outputs.bump_type }}
      has_changes:
        description: "true if there are releasable commits since the last tag"
        value: ${{ jobs.compute.outputs.has_changes }}

permissions:
  contents: read

jobs:
  compute:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}
    steps:
      # see the full history and every existing tag.
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: semver
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          SCOPE: ${{ inputs.scope }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}
        run: |
          set -euo pipefail

          # Find latest release tag FOR THIS COMPONENT (tag_prefix scopes this)
          LAST_TAG=$(git tag --list "${TAG_PREFIX}*" --sort=-v:refname | head -n1 || true)

          if [[ -z "$LAST_TAG" ]]; then
            CURRENT_VERSION="$INITIAL_VERSION"
            echo "No existing tags found for prefix '$TAG_PREFIX'. Baseline version: $CURRENT_VERSION"
          else
            CURRENT_VERSION="${LAST_TAG#"$TAG_PREFIX"}"
            echo "Latest tag: $LAST_TAG"
          fi

          # Look at ALL commits since this component's last tag (not just the last commit).
          RANGE="HEAD"
          [[ -n "$LAST_TAG" ]] && RANGE="${LAST_TAG}..HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s%n%b%n---")

          # Build the scope pattern:
          # - if SCOPE is set (e.g. "compute"), only match that exact scope: fix(compute):
          # - if SCOPE is empty, match any scope OR no scope at all (repo-wide mode)
          if [[ -n "$SCOPE" ]]; then
            SCOPE_RE="\\(${SCOPE}\\)"
          else
            SCOPE_RE="(\\([^)]*\\))?"
          fi

          HAS_CHANGES="false"
          BUMP="none"

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then
            BUMP="$BUMP_OVERRIDE"
            HAS_CHANGES="true"

          elif echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|BREAKING-CHANGE):|^[a-zA-Z]+${SCOPE_RE}!:"; then
            BUMP="major"
            HAS_CHANGES="true"

          elif echo "$COMMITS" | grep -qE "^feat${SCOPE_RE}:"; then
            BUMP="minor"
            HAS_CHANGES="true"

          elif echo "$COMMITS" | grep -qE "^fix${SCOPE_RE}:"; then
            BUMP="patch"
            HAS_CHANGES="true"
          fi

          # No releasable commit found for this scope
          if [[ "$HAS_CHANGES" == "false" ]]; then
            echo "No releasable commits found for scope '${SCOPE:-<repo-wide>}'."

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${TAG_PREFIX}${CURRENT_VERSION}"
              echo "bump_type=none"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR+1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR+1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH+1))
              ;;
          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="${TAG_PREFIX}${NEXT_VERSION}"

          echo "Release detected for scope '${SCOPE:-<repo-wide>}': $BUMP"
          echo "Next version: $NEXT_VERSION"

          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
          } >> "$GITHUB_OUTPUT"