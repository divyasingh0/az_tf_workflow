name: release-version

# ============================================================
# Reusable workflow for calculating the next semantic version.
#
# Release streams are independent:
#
#   storage-v2.0.0
#   network-v2.0.0
#   workflow-v2.0.0
#
# Older V1 tags are ignored.
# ============================================================

on:
  workflow_call:

    inputs:

      release_stream:
        description: "Release stream, e.g. storage-v2"
        required: true
        type: string

      scope:
        description: "Conventional Commit scope, e.g. storage"
        required: true
        type: string

      initial_version:
        description: "Initial version for a new release stream"
        required: false
        type: string
        default: "2.0.0"

      bump_override:
        description: "auto|major|minor|patch"
        required: false
        type: string
        default: "auto"

    outputs:

      current_version:
        description: "Latest version for this release stream"
        value: ${{ jobs.compute.outputs.current_version }}

      next_version:
        description: "Next calculated version"
        value: ${{ jobs.compute.outputs.next_version }}

      next_tag:
        description: "Next release tag"
        value: ${{ jobs.compute.outputs.next_tag }}

      bump_type:
        description: "major|minor|patch|none"
        value: ${{ jobs.compute.outputs.bump_type }}

      has_changes:
        description: "Whether a release is required"
        value: ${{ jobs.compute.outputs.has_changes }}


permissions:
  contents: read


jobs:

  compute:

    name: Calculate Version

    runs-on: ubuntu-latest

    outputs:

      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}

    steps:

      # ========================================================
      # Checkout complete history and all tags.
      # ========================================================

      - name: Checkout full history

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # Calculate version.
      # ========================================================

      - name: Compute next semantic version

        id: semver

        shell: bash

        env:

          RELEASE_STREAM: ${{ inputs.release_stream }}
          SCOPE: ${{ inputs.scope }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}

        run: |

          set -euo pipefail


          echo "=========================================="
          echo "Release Version Calculation"
          echo "=========================================="

          echo "Release stream : $RELEASE_STREAM"
          echo "Scope          : $SCOPE"


          # ====================================================
          # FIND LATEST TAG FOR THIS RELEASE STREAM ONLY
          #
          # Example:
          #
          # storage-v2.0.0
          # storage-v2.1.0
          #
          # These are considered.
          #
          # storage-v1.9.0
          # network-v2.0.0
          #
          # These are ignored.
          # ====================================================

          LAST_TAG=$(
            git tag --list "${RELEASE_STREAM}.*" \
              --sort=-v:refname |
            head -n1 || true
          )


          # ====================================================
          # DETERMINE CURRENT VERSION
          # ====================================================

          if [[ -z "$LAST_TAG" ]]; then

            CURRENT_VERSION="$INITIAL_VERSION"

            echo "No existing tag found."
            echo "Using initial version: $CURRENT_VERSION"

          else

            CURRENT_VERSION="${LAST_TAG#"$RELEASE_STREAM."}"

            echo "Latest tag: $LAST_TAG"
            echo "Current version: $CURRENT_VERSION"

          fi


          # ====================================================
          # DETERMINE COMMIT RANGE
          #
          # Only commits after this release stream's latest
          # release are evaluated.
          # ====================================================

          RANGE="HEAD"

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          fi


          echo "Commit range: $RANGE"


          # ====================================================
          # PROCESS COMMITS INDIVIDUALLY
          #
          # This is important.
          #
          # We evaluate each commit together with its body.
          # Therefore a BREAKING CHANGE is associated with the
          # commit that contains it.
          # ====================================================

          BUMP="none"
          HAS_CHANGES="false"


          while IFS= read -r COMMIT; do

            [[ -z "$COMMIT" ]] && continue


            # --------------------------------------------------
            # Extract subject.
            # --------------------------------------------------

            SUBJECT=$(echo "$COMMIT" | sed -n '1p')


            echo ""
            echo "Checking commit:"
            echo "$SUBJECT"


            # --------------------------------------------------
            # Check whether commit belongs to this component.
            #
            # Examples:
            #
            # feat(storage): ...
            # fix(storage): ...
            # feat(storage)!: ...
            #
            # network commits are ignored during storage release.
            # --------------------------------------------------

            if [[ "$SUBJECT" =~ ^[a-zA-Z]+\\(${SCOPE}\\)(!)?: ]]; then

              echo "Component match: YES"

            else

              echo "Component match: NO"
              continue

            fi


            # --------------------------------------------------
            # Check for BREAKING CHANGE.
            #
            # IMPORTANT:
            #
            # This check happens AFTER component matching.
            #
            # Therefore:
            #
            # feat(storage)!: ...
            #
            # can cause storage major release.
            #
            # But:
            #
            # feat(network)!: ...
            #
            # cannot cause storage major release.
            # --------------------------------------------------

            if echo "$COMMIT" |
              grep -qiE \
              "^[a-zA-Z]+\\(${SCOPE}\\)!:|^BREAKING CHANGE:|^BREAKING-CHANGE:"; then

              echo "Breaking change detected."

              BUMP="major"
              HAS_CHANGES="true"

              # Major is highest priority.
              # No need to process further for bump calculation.
              continue

            fi


            # --------------------------------------------------
            # Feature.
            # --------------------------------------------------

            if [[ "$SUBJECT" =~ ^feat\(${SCOPE}\): ]]; then

              echo "Feature detected."

              HAS_CHANGES="true"

              # Do not downgrade an already detected major bump.
              if [[ "$BUMP" != "major" ]]; then
                BUMP="minor"
              fi

              continue

            fi


            # --------------------------------------------------
            # Bug fix.
            # --------------------------------------------------

            if [[ "$SUBJECT" =~ ^fix\(${SCOPE}\): ]]; then

              echo "Bug fix detected."

              HAS_CHANGES="true"

              # Feature has higher priority than fix.
              if [[ "$BUMP" == "none" ]]; then
                BUMP="patch"
              fi

            fi

          done < <(
            git log "$RANGE" \
              --pretty=format:"%s%n%b%n---" \
              --no-merges |
            awk '
              BEGIN {
                RS="---"
                ORS=""
              }
              {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "")
                if (length($0) > 0)
                  print $0 "\n"
              }
            '
          )


          # ====================================================
          # MANUAL OVERRIDE
          #
          # Manual override always wins.
          # ====================================================

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            BUMP="$BUMP_OVERRIDE"
            HAS_CHANGES="true"

            echo ""
            echo "Manual bump override: $BUMP"

          fi


          # ====================================================
          # NO RELEASE REQUIRED
          # ====================================================

          if [[ "$HAS_CHANGES" == "false" ]]; then

            echo ""
            echo "No releasable commits found."

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${RELEASE_STREAM}.${CURRENT_VERSION}"
              echo "bump_type=none"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ====================================================
          # CALCULATE NEXT SEMVER
          # ====================================================

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"


          case "$BUMP" in

            major)

              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)

              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)

              PATCH=$((PATCH + 1))
              ;;

            *)

              echo "::error::Invalid bump type: $BUMP"
              exit 1
              ;;

          esac


          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          NEXT_TAG="${RELEASE_STREAM}.${NEXT_VERSION}"


          # ====================================================
          # DISPLAY RESULT
          # ====================================================

          echo ""
          echo "=========================================="
          echo "Release detected"
          echo "=========================================="

          echo "Scope          : $SCOPE"
          echo "Release stream : $RELEASE_STREAM"
          echo "Current        : $CURRENT_VERSION"
          echo "Bump           : $BUMP"
          echo "Next version   : $NEXT_VERSION"
          echo "Next tag       : $NEXT_TAG"

          echo "=========================================="


          # ====================================================
          # EXPORT OUTPUTS
          # ====================================================

          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
          } >> "$GITHUB_OUTPUT"
