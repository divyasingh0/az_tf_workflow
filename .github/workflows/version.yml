name: release-version

# ============================================================
# Reusable workflow for calculating the next semantic version.
#
# Release streams are independent.
#
# Examples:
#
#   storage-v2.0.0
#   network-v2.0.0
#   workflow-v2.0.0
#
# Older V1 tags are intentionally ignored:
#
#   storage-v1.9.0
#   network-v1.8.0
#
# The release workflow passes:
#
#   release_stream: storage-v2
#
# This workflow then looks ONLY at:
#
#   storage-v2.*
# ============================================================

on:
  workflow_call:

    inputs:

      # --------------------------------------------------------
      # Complete release stream.
      #
      # Example:
      #
      # storage-v2
      # network-v2
      # workflow-v2
      #
      # This is deliberately NOT just "storage-v".
      # --------------------------------------------------------

      release_stream:
        description: "Release stream, e.g. storage-v2 or network-v2"
        required: true
        type: string

      # --------------------------------------------------------
      # Conventional Commit scope.
      #
      # Example:
      #
      # feat(storage): add private endpoint
      #
      # scope = storage
      # --------------------------------------------------------

      scope:
        description: "Conventional Commit scope, e.g. storage"
        required: true
        type: string

      # --------------------------------------------------------
      # Bootstrap version.
      #
      # Normally the stream already has v2.0.0, so this is
      # only used if the stream has no existing tag.
      # --------------------------------------------------------

      initial_version:
        description: "Baseline version when no release tag exists"
        required: false
        type: string
        default: "2.0.0"

      # --------------------------------------------------------
      # Optional manual version override.
      # --------------------------------------------------------

      bump_override:
        description: "auto|major|minor|patch"
        required: false
        type: string
        default: "auto"


    outputs:

      current_version:
        description: "Latest version for this release stream"
        value: ${{ jobs.compute.outputs.current_version }}

      next_version:
        description: "Next calculated version"
        value: ${{ jobs.compute.outputs.next_version }}

      next_tag:
        description: "Next release tag"
        value: ${{ jobs.compute.outputs.next_tag }}

      bump_type:
        description: "major|minor|patch|none"
        value: ${{ jobs.compute.outputs.bump_type }}

      has_changes:
        description: "Whether a release is required"
        value: ${{ jobs.compute.outputs.has_changes }}


permissions:
  contents: read


jobs:

  compute:

    name: Calculate Version

    runs-on: ubuntu-latest

    outputs:

      current_version: ${{ steps.semver.outputs.current_version }}

      next_version: ${{ steps.semver.outputs.next_version }}

      next_tag: ${{ steps.semver.outputs.next_tag }}

      bump_type: ${{ steps.semver.outputs.bump_type }}

      has_changes: ${{ steps.semver.outputs.has_changes }}


    steps:

      # ========================================================
      # Checkout complete repository history and all tags.
      # ========================================================

      - name: Checkout full history

        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

        with:
          fetch-depth: 0


      # ========================================================
      # Calculate next version.
      # ========================================================

      - name: Compute next semantic version

        id: semver

        shell: bash

        env:

          RELEASE_STREAM: ${{ inputs.release_stream }}

          SCOPE: ${{ inputs.scope }}

          INITIAL_VERSION: ${{ inputs.initial_version }}

          BUMP_OVERRIDE: ${{ inputs.bump_override }}

        run: |

          set -euo pipefail


          echo "=========================================="

          echo "Release Version Calculation"

          echo "=========================================="

          echo "Release stream : $RELEASE_STREAM"

          echo "Scope          : $SCOPE"


          # ====================================================
          # FIND LATEST TAG FOR THIS RELEASE STREAM ONLY
          #
          # Example:
          #
          # RELEASE_STREAM=storage-v2
          #
          # Matching:
          #
          # storage-v2.0.0
          # storage-v2.1.0
          #
          # NOT matching:
          #
          # storage-v1.9.0
          # network-v2.0.0
          # ====================================================

          LAST_TAG=$(
            git tag --list "${RELEASE_STREAM}.*" \
              --sort=-v:refname |
            head -n1 || true
          )


          if [[ -z "$LAST_TAG" ]]; then

            CURRENT_VERSION="$INITIAL_VERSION"

            echo "No existing tag found for stream:"
            echo "$RELEASE_STREAM"

            echo "Using initial version:"
            echo "$CURRENT_VERSION"

          else

            # --------------------------------------------------
            # Remove the release stream prefix.
            #
            # storage-v2.0.0
            #       ↓
            # 2.0.0
            # --------------------------------------------------

            CURRENT_VERSION="${LAST_TAG#"$RELEASE_STREAM."}"

            echo "Latest release tag:"
            echo "$LAST_TAG"

            echo "Current version:"
            echo "$CURRENT_VERSION"

          fi


          # ====================================================
          # DETERMINE COMMIT RANGE
          #
          # Only commits after the latest release of THIS
          # release stream are considered.
          # ====================================================

          RANGE="HEAD"

          if [[ -n "$LAST_TAG" ]]; then

            RANGE="${LAST_TAG}..HEAD"

          fi


          echo "Commit range:"
          echo "$RANGE"


          # ====================================================
          # READ COMMIT SUBJECTS + BODIES
          # ====================================================

          COMMITS=$(
            git log "$RANGE" \
              --pretty=format:"%s%n%b%n---" \
              --no-merges
          )


          # ====================================================
          # MATCH ONLY THIS COMPONENT'S CONVENTIONAL COMMITS
          #
          # Examples:
          #
          # feat(storage):
          # fix(storage):
          # feat(storage)!:
          #
          # Other components are ignored.
          # ====================================================

          SCOPE_RE="\\(${SCOPE}\\)"


          HAS_CHANGES="false"

          BUMP="none"


          # ====================================================
          # MANUAL OVERRIDE
          # ====================================================

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            BUMP="$BUMP_OVERRIDE"

            HAS_CHANGES="true"


          # ====================================================
          # BREAKING CHANGE
          # ====================================================

          elif echo "$COMMITS" |
            grep -qiE \
            "^(BREAKING CHANGE|BREAKING-CHANGE):|^[a-zA-Z]+${SCOPE_RE}!:"; then

            BUMP="major"

            HAS_CHANGES="true"


          # ====================================================
          # FEATURE
          # ====================================================

          elif echo "$COMMITS" |
            grep -qE \
            "^feat${SCOPE_RE}:"; then

            BUMP="minor"

            HAS_CHANGES="true"


          # ====================================================
          # BUG FIX
          # ====================================================

          elif echo "$COMMITS" |
            grep -qE \
            "^fix${SCOPE_RE}:"; then

            BUMP="patch"

            HAS_CHANGES="true"

          fi


          # ====================================================
          # NO RELEASE REQUIRED
          # ====================================================

          if [[ "$HAS_CHANGES" == "false" ]]; then

            echo ""
            echo "No releasable commits found."
            echo "Scope: $SCOPE"
            echo "Stream: $RELEASE_STREAM"

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${RELEASE_STREAM}.${CURRENT_VERSION}"
              echo "bump_type=none"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ====================================================
          # CALCULATE NEXT SEMVER
          # ====================================================

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"


          case "$BUMP" in

            major)

              MAJOR=$((MAJOR + 1))

              MINOR=0

              PATCH=0

              ;;


            minor)

              MINOR=$((MINOR + 1))

              PATCH=0

              ;;


            patch)

              PATCH=$((PATCH + 1))

              ;;


            *)

              echo "::error::Invalid bump type: $BUMP"

              exit 1

              ;;

          esac


          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"


          # ====================================================
          # BUILD FINAL TAG
          #
          # storage-v2 + 1.1.0
          #       ↓
          # storage-v2.1.0
          # ====================================================

          NEXT_TAG="${RELEASE_STREAM}.${NEXT_VERSION}"


          echo ""

          echo "=========================================="

          echo "Release detected"

          echo "=========================================="

          echo "Scope          : $SCOPE"

          echo "Release stream : $RELEASE_STREAM"

          echo "Current        : $CURRENT_VERSION"

          echo "Bump           : $BUMP"

          echo "Next version   : $NEXT_VERSION"

          echo "Next tag       : $NEXT_TAG"

          echo "=========================================="


          # ====================================================
          # EXPORT OUTPUTS
          # ====================================================

          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
          } >> "$GITHUB_OUTPUT"