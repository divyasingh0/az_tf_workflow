
name: release-version

# -----------------------------------------------------------------------------
# Reusable workflow for calculating the next semantic version.
#
# The release stream is automatically determined from the Conventional
# Commit scope.
#
# Examples:
#
#   feat(workflow): add release automation
#       -> workflow-v2.1.0
#
#   fix(workflow): fix workflow
#       -> workflow-v2.1.1
#
#   feat(release): improve release process
#       -> release-v2.1.0
#
#   feat: common repository change
#       -> v2.1.0
#
# Only the release stream matching the triggering PR/commit is updated.
# -----------------------------------------------------------------------------

on:
  workflow_call:

    inputs:

      # -------------------------------------------------------------------------
      # Default release tag prefix
      # -------------------------------------------------------------------------
      tag_prefix:
        description: "Default tag prefix when no Conventional Commit scope exists"
        required: false
        type: string
        default: "v"

      initial_version:
        description: "Baseline version when no previous release tag exists"
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Override automatic version detection: auto | major | minor | patch"
        required: false
        type: string
        default: "auto"


    # ---------------------------------------------------------------------------
    # Outputs
    # ---------------------------------------------------------------------------
    outputs:

      current_version:
        description: "Latest released version for the selected release stream"
        value: ${{ jobs.compute-version.outputs.current_version }}

      next_version:
        description: "Calculated next version"
        value: ${{ jobs.compute-version.outputs.next_version }}

      next_tag:
        description: "Calculated next Git tag"
        value: ${{ jobs.compute-version.outputs.next_tag }}

      bump_type:
        description: "Version bump type"
        value: ${{ jobs.compute-version.outputs.bump_type }}

      has_changes:
        description: "Whether the triggering PR requires a release"
        value: ${{ jobs.compute-version.outputs.has_changes }}

      release_scope:
        description: "Conventional Commit scope selected for this release"
        value: ${{ jobs.compute-version.outputs.release_scope }}

      release_tag_prefix:
        description: "Tag prefix selected for this release stream"
        value: ${{ jobs.compute-version.outputs.release_tag_prefix }}


# -----------------------------------------------------------------------------
# Permissions
# -----------------------------------------------------------------------------
permissions:
  contents: read
  pull-requests: read


jobs:

  # ============================================================================
  # Calculate release version
  # ============================================================================
  compute-version:
    name: Calculate Version
    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}
      release_scope: ${{ steps.semver.outputs.release_scope }}
      release_tag_prefix: ${{ steps.semver.outputs.release_tag_prefix }}


    steps:

      # -------------------------------------------------------------------------
      # Checkout
      # -------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0


      # -------------------------------------------------------------------------
      # Calculate semantic version
      # -------------------------------------------------------------------------
      - name: Calculate semantic version
        id: semver
        shell: bash
        env:
          DEFAULT_TAG_PREFIX: ${{ inputs.tag_prefix }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------------
          # Get triggering PR
          # ---------------------------------------------------------------------
          PR=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '
              .[]
              | select(.merged_at != null)
              | {
                  number,
                  title,
                  author: .user.login
                }
            ' \
            | jq -s '.[0] // empty')

          # ---------------------------------------------------------------------
          # Determine commit / PR title
          # ---------------------------------------------------------------------
          if [[ -n "$PR" ]]; then

            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_TITLE=$(echo "$PR" | jq -r '.title')
            PR_AUTHOR=$(echo "$PR" | jq -r '.author')

            echo "::group::Triggering Pull Request"
            echo "PR number : #${PR_NUMBER}"
            echo "PR title  : ${PR_TITLE}"
            echo "PR author : @${PR_AUTHOR}"
            echo "::endgroup::"

          else

            echo "::warning::No merged pull request found for commit ${SHA}."

            PR_TITLE=$(git log -1 --pretty=format:"%s")

            echo "::notice::Using commit message: ${PR_TITLE}"

          fi


          # ---------------------------------------------------------------------
          # Parse Conventional Commit
          #
          # Supported examples:
          #
          #   feat(workflow): ...
          #   fix(workflow): ...
          #   feat(release)!: ...
          #   feat: ...
          # ---------------------------------------------------------------------

          COMMIT_TYPE=""
          COMMIT_SCOPE=""
          BREAKING="false"

          if [[ "$PR_TITLE" =~ ^([a-zA-Z]+)(\(([a-zA-Z0-9._-]+)\))?(!)?:[[:space:]] ]]; then

            COMMIT_TYPE="${BASH_REMATCH[1]}"
            COMMIT_SCOPE="${BASH_REMATCH[3]:-}"

            if [[ -n "${BASH_REMATCH[4]:-}" ]]; then
              BREAKING="true"
            fi

          elif [[ "$PR_TITLE" =~ ^BREAKING[[:space:]]CHANGE: ]]; then

            COMMIT_TYPE="breaking"
            COMMIT_SCOPE=""
            BREAKING="true"

          else

            echo "::notice::Commit does not follow Conventional Commit format."
            echo "::notice::No release will be created."

            {
              echo "has_changes=false"
              echo "current_version=$INITIAL_VERSION"
              echo "next_version=$INITIAL_VERSION"
              echo "next_tag=${DEFAULT_TAG_PREFIX}${INITIAL_VERSION}"
              echo "bump_type=none"
              echo "release_scope="
              echo "release_tag_prefix=${DEFAULT_TAG_PREFIX}"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ---------------------------------------------------------------------
          # Determine release stream
          #
          # Scoped commit:
          #
          #   feat(workflow): ...
          #       -> workflow-v
          #
          #   feat(release): ...
          #       -> release-v
          #
          # Unscoped commit:
          #
          #   feat: ...
          #       -> v
          # ---------------------------------------------------------------------

          if [[ -n "$COMMIT_SCOPE" ]]; then

            RELEASE_SCOPE="$COMMIT_SCOPE"
            RELEASE_TAG_PREFIX="${COMMIT_SCOPE}-${DEFAULT_TAG_PREFIX}"

          else

            RELEASE_SCOPE=""
            RELEASE_TAG_PREFIX="$DEFAULT_TAG_PREFIX"

          fi


          echo "::group::Release Stream"
          echo "Commit type    : ${COMMIT_TYPE}"
          echo "Commit scope   : ${COMMIT_SCOPE:-<none>}"
          echo "Release scope  : ${RELEASE_SCOPE:-repo-wide}"
          echo "Tag prefix     : ${RELEASE_TAG_PREFIX}"
          echo "::endgroup::"


          # ---------------------------------------------------------------------
          # Determine current version for THIS stream only
          #
          # Example:
          #
          #   workflow-v2.3.0
          #   workflow-v2.2.0
          #   release-v2.5.0
          #
          # A workflow commit only looks at workflow-v*.
          # ---------------------------------------------------------------------

          LAST_TAG=$(
            git tag --list "${RELEASE_TAG_PREFIX}[0-9]*" \
              --sort=-v:refname |
            head -n1 || true
          )


          if [[ -z "$LAST_TAG" ]]; then

            CURRENT_VERSION="$INITIAL_VERSION"

            echo "::notice::No existing release tag found for '${RELEASE_TAG_PREFIX}'."

          else

            CURRENT_VERSION="${LAST_TAG#"$RELEASE_TAG_PREFIX"}"

          fi


          echo "::group::Current Release"
          echo "Latest tag      : ${LAST_TAG:-<none>}"
          echo "Current version : ${CURRENT_VERSION}"
          echo "::endgroup::"


          # ---------------------------------------------------------------------
          # Determine version bump
          # ---------------------------------------------------------------------

          HAS_CHANGES="true"

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            case "$BUMP_OVERRIDE" in

              major|minor|patch)
                BUMP="$BUMP_OVERRIDE"
                ;;

              *)
                echo "::error::Invalid bump_override: ${BUMP_OVERRIDE}"
                exit 1
                ;;

            esac

          elif [[ "$BREAKING" == "true" ]]; then

            BUMP="major"

          elif [[ "$COMMIT_TYPE" == "feat" ]]; then

            BUMP="minor"

          elif [[ "$COMMIT_TYPE" == "fix" ]]; then

            BUMP="patch"

          elif [[ "$COMMIT_TYPE" == "breaking" ]]; then

            BUMP="major"

          else

            # Other Conventional Commit types do not create a release.
            echo "::notice::Commit type '${COMMIT_TYPE}' does not require a release."

            HAS_CHANGES="false"
            BUMP="none"

          fi


          # ---------------------------------------------------------------------
          # No release required
          # ---------------------------------------------------------------------
          if [[ "$HAS_CHANGES" == "false" ]]; then

            {
              echo "has_changes=false"
              echo "current_version=$CURRENT_VERSION"
              echo "next_version=$CURRENT_VERSION"
              echo "next_tag=${RELEASE_TAG_PREFIX}${CURRENT_VERSION}"
              echo "bump_type=none"
              echo "release_scope=$RELEASE_SCOPE"
              echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
            } >> "$GITHUB_OUTPUT"

            exit 0

          fi


          # ---------------------------------------------------------------------
          # Calculate next semantic version
          # ---------------------------------------------------------------------
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"


          case "$BUMP" in

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;

          esac


          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="${RELEASE_TAG_PREFIX}${NEXT_VERSION}"


          # ---------------------------------------------------------------------
          # Release calculation summary
          # ---------------------------------------------------------------------
          echo "::group::Release Calculation"
          echo "PR title        : ${PR_TITLE}"
          echo "Commit type     : ${COMMIT_TYPE}"
          echo "Commit scope    : ${COMMIT_SCOPE:-<none>}"
          echo "Release scope   : ${RELEASE_SCOPE:-repo-wide}"
          echo "Bump type       : ${BUMP}"
          echo "Current version : ${CURRENT_VERSION}"
          echo "Next version    : ${NEXT_VERSION}"
          echo "Next tag        : ${NEXT_TAG}"
          echo "::endgroup::"


          # ---------------------------------------------------------------------
          # Workflow outputs
          # ---------------------------------------------------------------------
          {
            echo "has_changes=true"
            echo "current_version=$CURRENT_VERSION"
            echo "next_version=$NEXT_VERSION"
            echo "next_tag=$NEXT_TAG"
            echo "bump_type=$BUMP"
            echo "release_scope=$RELEASE_SCOPE"
            echo "release_tag_prefix=$RELEASE_TAG_PREFIX"
          } >> "$GITHUB_OUTPUT"


          # ---------------------------------------------------------------------
          # GitHub Actions summary
          # ---------------------------------------------------------------------
          {
            echo "## Release Calculation"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Commit | ${PR_TITLE} |"
            echo "| Commit type | ${COMMIT_TYPE} |"
            echo "| Commit scope | ${COMMIT_SCOPE:-none} |"
            echo "| Release scope | ${RELEASE_SCOPE:-repo-wide} |"
            echo "| Release tag prefix | ${RELEASE_TAG_PREFIX} |"
            echo "| Current version | ${CURRENT_VERSION} |"
            echo "| Next version | ${NEXT_VERSION} |"
            echo "| Bump type | ${BUMP} |"
            echo "| Next tag | ${NEXT_TAG} |"
          } >> "$GITHUB_STEP_SUMMARY"
