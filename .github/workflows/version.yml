
name: release-version

# Reusable workflow:
# - Calculates the next semantic version from Conventional Commits.
# - Maintains an independent version history for each tag prefix.
#
# Example:
#   workflow-v2.0.0
#   workflow-v2.1.0
#
#   release-v2.0.0
#   release-v2.1.0
#
# The tag_prefix input determines which tag stream is evaluated.
# Therefore, workflow-* and release-* versions are completely independent.

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: "Tag prefix used for this release stream, e.g. workflow-v or release-v"
        required: false
        type: string
        default: "v"

      scope:
        description: "Optional Conventional Commit scope. Empty = repository-wide."
        required: false
        type: string
        default: ""

      initial_version:
        description: "Starting version when no tag exists for this tag prefix."
        required: false
        type: string
        default: "0.1.0"

      bump_override:
        description: "Force a version bump: auto|major|minor|patch"
        required: false
        type: string
        default: "auto"

    outputs:
      current_version:
        description: "Latest version for this tag prefix, without prefix."
        value: ${{ jobs.compute.outputs.current_version }}

      next_version:
        description: "Calculated next version, without prefix."
        value: ${{ jobs.compute.outputs.next_version }}

      next_tag:
        description: "Calculated next tag including prefix."
        value: ${{ jobs.compute.outputs.next_tag }}

      bump_type:
        description: "Calculated bump: major|minor|patch|none."
        value: ${{ jobs.compute.outputs.bump_type }}

      has_changes:
        description: "true when releasable Conventional Commits are found."
        value: ${{ jobs.compute.outputs.has_changes }}

permissions:
  contents: read
  pull-requests: read

jobs:
  compute:
    name: Calculate Version

    runs-on: ubuntu-latest

    outputs:
      current_version: ${{ steps.semver.outputs.current_version }}
      next_version: ${{ steps.semver.outputs.next_version }}
      next_tag: ${{ steps.semver.outputs.next_tag }}
      bump_type: ${{ steps.semver.outputs.bump_type }}
      has_changes: ${{ steps.semver.outputs.has_changes }}

    steps:
      ##########################################################################
      # CHECKOUT
      ##########################################################################

      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      ##########################################################################
      # VERSION CALCULATION
      ##########################################################################

      - name: Compute next semantic version
        id: semver
        shell: bash
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          SCOPE: ${{ inputs.scope }}
          INITIAL_VERSION: ${{ inputs.initial_version }}
          BUMP_OVERRIDE: ${{ inputs.bump_override }}

        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Release Version Calculation"
          echo "============================================================"
          echo "Tag prefix      : ${TAG_PREFIX}"
          echo "Scope           : ${SCOPE:-<repo-wide>}"
          echo "Initial version : ${INITIAL_VERSION}"
          echo "Bump override   : ${BUMP_OVERRIDE}"
          echo "============================================================"

          ######################################################################
          # VALIDATE INPUTS
          ######################################################################

          case "$BUMP_OVERRIDE" in
            auto|major|minor|patch)
              ;;
            *)
              echo "::error::Invalid bump_override: '$BUMP_OVERRIDE'"
              echo "::error::Allowed values: auto, major, minor, patch"
              exit 1
              ;;
          esac

          if [[ ! "$INITIAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid initial_version: '$INITIAL_VERSION'"
            echo "::error::Expected format: MAJOR.MINOR.PATCH"
            exit 1
          fi

          ######################################################################
          # FIND LATEST TAG FOR THIS RELEASE STREAM
          ######################################################################
          #
          # IMPORTANT:
          #
          # If TAG_PREFIX=workflow-v:
          #   workflow-v2.0.0
          #   workflow-v2.1.0
          #
          # If TAG_PREFIX=release-v:
          #   release-v2.0.0
          #   release-v2.1.0
          #
          # The two streams are completely independent.
          ######################################################################

          LAST_TAG="$(
            git tag --list "${TAG_PREFIX}[0-9]*" \
              --sort=-v:refname |
              head -n1 || true
          )"

          if [[ -z "$LAST_TAG" ]]; then
            CURRENT_VERSION="$INITIAL_VERSION"

            echo ""
            echo "No existing tag found for prefix '${TAG_PREFIX}'."
            echo "Using initial version: ${CURRENT_VERSION}"

          else
            CURRENT_VERSION="${LAST_TAG#"$TAG_PREFIX"}"

            echo ""
            echo "Latest tag for prefix '${TAG_PREFIX}': ${LAST_TAG}"
            echo "Current version: ${CURRENT_VERSION}"
          fi

          ######################################################################
          # DETERMINE COMMIT RANGE
          ######################################################################

          RANGE="HEAD"

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          fi

          echo ""
          echo "Commit range: ${RANGE}"

          ######################################################################
          # GET COMMITS
          ######################################################################

          COMMITS="$(
            git log "$RANGE" \
              --pretty=format:"%s%n%b%n---" \
              --no-merges
          )"

          ######################################################################
          # BUILD CONVENTIONAL COMMIT SCOPE PATTERN
          ######################################################################

          if [[ -n "$SCOPE" ]]; then
            #
            # Example:
            #
            # scope=workflow
            #
            # Matches:
            #   feat(workflow):
            #   fix(workflow):
            #   chore(workflow):
            #   feat(workflow)!:
            #
            SCOPE_RE="\\(${SCOPE}\\)"

            echo ""
            echo "Conventional Commit scope filter: ${SCOPE}"

          else
            #
            # Repository-wide mode.
            #
            # Matches:
            #   feat:
            #   feat(test):
            #   fix:
            #   fix(test):
            #
            SCOPE_RE="(\\([^)]*\\))?"

            echo ""
            echo "Conventional Commit scope filter: repository-wide"
          fi

          ######################################################################
          # DETERMINE VERSION BUMP
          ######################################################################

          HAS_CHANGES="false"
          BUMP="none"

          ######################################################################
          # MANUAL OVERRIDE
          ######################################################################

          if [[ "$BUMP_OVERRIDE" != "auto" ]]; then

            BUMP="$BUMP_OVERRIDE"
            HAS_CHANGES="true"

            echo ""
            echo "Manual version bump requested: ${BUMP}"

          ######################################################################
          # BREAKING CHANGE
          ######################################################################

          elif echo "$COMMITS" | grep -qiE \
            "^(BREAKING CHANGE|BREAKING-CHANGE):|^[a-zA-Z]+${SCOPE_RE}!:"; then

            BUMP="major"
            HAS_CHANGES="true"

            echo ""
            echo "Breaking change detected."
            echo "Version bump: major"

          ######################################################################
          # FEATURE
          ######################################################################

          elif echo "$COMMITS" | grep -qE \
            "^feat${SCOPE_RE}:"; then

            BUMP="minor"
            HAS_CHANGES="true"

            echo ""
            echo "Feature commit detected."
            echo "Version bump: minor"

          ######################################################################
          # FIX
          ######################################################################

          elif echo "$COMMITS" | grep -qE \
            "^fix${SCOPE_RE}:"; then

            BUMP="patch"
            HAS_CHANGES="true"

            echo ""
            echo "Fix commit detected."
            echo "Version bump: patch"

          fi

          ######################################################################
          # NO RELEASE
          ######################################################################

          if [[ "$HAS_CHANGES" == "false" ]]; then

            echo ""
            echo "No releasable Conventional Commit found."
            echo "No release will be created."

            {
              echo "has_changes=false"
              echo "current_version=${CURRENT_VERSION}"
              echo "next_version=${CURRENT_VERSION}"
              echo "next_tag=${TAG_PREFIX}${CURRENT_VERSION}"
              echo "bump_type=none"
            } >> "$GITHUB_OUTPUT"

            exit 0
          fi

          ######################################################################
          # CALCULATE NEXT VERSION
          ######################################################################

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case "$BUMP" in

            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;

            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;

            patch)
              PATCH=$((PATCH + 1))
              ;;

            *)
              echo "::error::Unexpected bump type: ${BUMP}"
              exit 1
              ;;

          esac

          NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEXT_TAG="${TAG_PREFIX}${NEXT_VERSION}"

          ######################################################################
          # OUTPUT
          ######################################################################

          echo ""
          echo "============================================================"
          echo "Version Result"
          echo "============================================================"
          echo "Tag prefix      : ${TAG_PREFIX}"
          echo "Previous tag    : ${LAST_TAG:-<none>}"
          echo "Current version : ${CURRENT_VERSION}"
          echo "Bump type       : ${BUMP}"
          echo "Next version    : ${NEXT_VERSION}"
          echo "Next tag        : ${NEXT_TAG}"
          echo "============================================================"

          {
            echo "has_changes=true"
            echo "current_version=${CURRENT_VERSION}"
            echo "next_version=${NEXT_VERSION}"
            echo "next_tag=${NEXT_TAG}"
            echo "bump_type=${BUMP}"
          } >> "$GITHUB_OUTPUT"
