name: Terraform Deployment

on:
  workflow_dispatch:
    inputs:

      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

      commit_sha:
        description: "Approved Terraform Plan Commit SHA"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  WORKING_DIRECTORY: .

jobs:

  # ===========================================================================
  # DEPLOY APPROVED PLAN
  # ===========================================================================
  deploy:
    name: Deploy Approved Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:

      # -----------------------------------------------------------------------
      # Determine Application from Repository
      # -----------------------------------------------------------------------
      - name: Determine Application
        id: application
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |

          case "$REPOSITORY" in
            *merch*)
              APPLICATION="merch"
              ;;
            *storeapps*)
              APPLICATION="storeapps"
              ;;
            *edna*)
              APPLICATION="edna"
              ;;
            *)
              echo "Unable to determine application from repository: $REPOSITORY"
              exit 1
              ;;
          esac

          echo "Application: $APPLICATION"
          echo "application=$APPLICATION" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Checkout EXACT commit for which the plan was generated
      #
      # This is important because the Terraform plan is tied to the
      # configuration/provider versions used when the plan was created.
      # -----------------------------------------------------------------------
      - name: Checkout Plan Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      # -----------------------------------------------------------------------
      # Read Terraform Version
      # -----------------------------------------------------------------------
      - name: Read Terraform Version
        id: tf_version
        run: |
          echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Setup Terraform
      # -----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf_version.outputs.version }}

      # -----------------------------------------------------------------------
      # Azure Login
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # Download Approved Plan from Azure Storage
      #
      # Storage:
      #
      # <application>/<environment>/<commit-sha>/
      # -----------------------------------------------------------------------
      - name: Download Approved Plan
        env:
          STORAGE_ACCOUNT: ${{ secrets.TF_ARTIFACT_STORAGE_ACCOUNT }}
          APPLICATION: ${{ steps.application.outputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |

          mkdir -p approved-plan

          az storage blob download-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --source "$APPLICATION" \
            --pattern "$ENVIRONMENT/$COMMIT_SHA/*" \
            --destination approved-plan \
            --auth-mode login

      # -----------------------------------------------------------------------
      # Locate downloaded plan files
      # -----------------------------------------------------------------------
      - name: Prepare Approved Plan
        run: |

          echo "Downloaded files:"
          find approved-plan -type f -print

          TFPLAN=$(find approved-plan -type f -name "tfplan" | head -n 1)
          TFPLAN_TXT=$(find approved-plan -type f -name "tfplan.txt" | head -n 1)
          CHECKSUM=$(find approved-plan -type f -name "tfplan.sha256" | head -n 1)
          METADATA=$(find approved-plan -type f -name "plan-metadata.json" | head -n 1)

          test -n "$TFPLAN"
          test -n "$CHECKSUM"
          test -n "$METADATA"

          cp "$TFPLAN" approved-tfplan
          cp "$CHECKSUM" approved-tfplan.sha256
          cp "$METADATA" approved-plan-metadata.json

          if [ -n "$TFPLAN_TXT" ]; then
            cp "$TFPLAN_TXT" approved-tfplan.txt
          fi

      # -----------------------------------------------------------------------
      # Verify checksum
      # -----------------------------------------------------------------------
      - name: Verify Plan Checksum
        run: |

          EXPECTED_FILE="approved-tfplan"

          EXPECTED_HASH=$(awk '{print $1}' approved-tfplan.sha256)
          ACTUAL_HASH=$(sha256sum "$EXPECTED_FILE" | awk '{print $1}')

          echo "Expected SHA256: $EXPECTED_HASH"
          echo "Actual SHA256:   $ACTUAL_HASH"

          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "Terraform plan checksum verification failed."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Verify Plan Metadata
      # -----------------------------------------------------------------------
      - name: Verify Plan Metadata
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |

          jq -e \
            --arg repo "$EXPECTED_REPOSITORY" \
            --arg env "$EXPECTED_ENVIRONMENT" \
            --arg sha "$EXPECTED_COMMIT_SHA" \
            '
            .repository == $repo and
            .environment == $env and
            .commit_sha == $sha
            ' approved-plan-metadata.json

      # -----------------------------------------------------------------------
      # Terraform Init
      #
      # IMPORTANT:
      # terraform plan is NOT executed.
      # -----------------------------------------------------------------------
      - name: Terraform Init
        run: |

          git config --global \
            url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf \
            "https://github.com/"

          terraform init \
            -backend-config=environment/${{ inputs.environment }}/backend.tfvars \
            -input=false

      # -----------------------------------------------------------------------
      # APPLY EXACT APPROVED PLAN
      #
      # No terraform plan.
      # -----------------------------------------------------------------------
      - name: Terraform Apply Approved Plan
        run: |

          terraform apply \
            -input=false \
            -auto-approve \
            approved-tfplan

      # -----------------------------------------------------------------------
      # Deployment Summary
      # -----------------------------------------------------------------------
      - name: Deployment Summary
        env:
          APPLICATION: ${{ steps.application.outputs.application }}
          ENVIRONMENT: ${{ inputs.environment }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |

          echo "### Terraform Deployment Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application: $APPLICATION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Plan Commit SHA: $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform Plan: NOT EXECUTED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Terraform Apply: EXECUTED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storage Path: $APPLICATION/$ENVIRONMENT/$COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"