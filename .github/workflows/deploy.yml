name: Reusable - Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: environment
        required: true
      commit_sha:
        description: "Optional — exact short commit SHA to deploy. Leave blank to deploy the latest approved plan."
        required: false
        type: string
 

